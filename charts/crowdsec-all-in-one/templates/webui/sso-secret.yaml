{{- if and .Values.webui.sso.enabled (not .Values.webui.sso.oidc.existingSecret) .Values.webui.sso.oidc.clientSecret -}}
# OIDC client secret for WebUI SSO. Generated only when webui.sso.oidc.clientSecret
# is set inline AND no existingSecret is provided. For production, prefer
# webui.sso.oidc.existingSecret pointing at a Secret provisioned externally
# (sealed-secrets, ExternalSecrets, Vault CSI…).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webui.sso.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crowdsec-all-in-one.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.webui.sso.oidc.existingSecretKey | default "clientSecret" }}: {{ .Values.webui.sso.oidc.clientSecret | quote }}
{{- end }}
