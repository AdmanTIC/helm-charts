{{- /*
  crowdsec-lapi-secrets — Secret consommé par le LAPI et l'agent du sub-chart.
  Contient :
    • csLapiSecret     → clé HMAC signant les JWT émis par le LAPI aux agents
    • registrationToken → token partagé pour l'auto-enrollment des agents

  Pourquoi ce template côté chart parent :
  Le sub-chart officiel crowdsec-0.24.0 template déjà ce Secret, mais ses
  helpers `lapi.csLapiSecret` / `lapi.registrationToken` s'appuient sur
  `lookup` avec `randAscii 64` / `randAlphaNum 48` en fallback. Or `lookup`
  retourne nil en mode `helm template` — mode utilisé par ArgoCD pour rendre
  le chart. Résultat : à chaque sync, le sub-chart régénère des valeurs
  aléatoires DIFFÉRENTES, ArgoCD détecte un diff, apply, LAPI redémarre
  (rolling déclenché par le checksum du Secret), la main Sync phase ne se
  stabilise jamais et les hooks PostSync (install-collections,
  register-webui, restart-agent) ne se déclenchent jamais.

  Fix : on prend le contrôle du Secret côté chart parent avec des valeurs
  déterministes (sha256 basé sur namespace+release), on préserve les valeurs
  existantes via `lookup` quand celui-ci fonctionne (helm install/upgrade
  CLI), et on demande au sub-chart de ne PAS générer son Secret via
  `crowdsec.secrets.externalSecret.name: crowdsec-lapi-secrets` (cf.
  values.yaml). Le LAPI et l'agent référencent le Secret par son nom, ils
  trouvent le nôtre à la place.

  Migration depuis une release existante :
  À la 1re Sync post-upgrade, ArgoCD substitue les valeurs random préexistantes
  par nos valeurs déterministes. La rotation du csLapiSecret invalide les JWT
  déjà émis — les agents ré-authentifient automatiquement (POST /watchers/login
  avec username+password de local_api_credentials.yaml, récupèrent un nouveau
  JWT signé par la nouvelle clé). Rotation transparente en ~10s.
  Le registrationToken ne sert QUE pour l'enrollment initial d'un nouvel agent :
  le rotate n'affecte pas les agents déjà enregistrés.

  Note sécurité : sha256("<ns>/<release>:role") est déterministe, quelqu'un
  connaissant (ns, release) peut recalculer. Acceptable pour du interne
  cluster (les Secrets sont déjà accessibles avec le RBAC). Pour du hardened,
  fournir les valeurs via `crowdsec.lapi.secrets.csLapiSecret` /
  `crowdsec.lapi.secrets.registrationToken` — la sous-chart les utilise en
  priorité, mais dans ce cas laisser `secrets.externalSecret.name` à ""
  côté crowdsec pour rester sur son template natif.
*/}}
{{- $secretName := "crowdsec-lapi-secrets" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}

{{- $csLapiSecret := "" -}}
{{- $registrationToken := "" -}}

{{- if and $existing (hasKey ($existing.data | default dict) "csLapiSecret") -}}
  {{- $csLapiSecret     = index $existing.data "csLapiSecret"     | b64dec -}}
  {{- $registrationToken = index $existing.data "registrationToken" | b64dec -}}
{{- else -}}
  {{- $seed := printf "%s/%s" .Release.Namespace .Release.Name -}}
  {{- /* csLapiSecret : ~64 chars alphanum, registrationToken : ~48 chars.
       On utilise sha256 (64 hex chars) et on tronque à la bonne longueur. */ -}}
  {{- $csLapiSecret     = printf "%s:cslapisecret"      $seed | sha256sum | trunc 64 -}}
  {{- $registrationToken = printf "%s:registrationtoken" $seed | sha256sum | trunc 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crowdsec-all-in-one.labels" . | nindent 4 }}
    type: lapi
  annotations:
    # Ne jamais supprimer ce Secret (helm uninstall, argocd prune).
    "helm.sh/resource-policy": keep
    "argocd.argoproj.io/sync-options": Prune=false
type: Opaque
stringData:
  csLapiSecret: {{ $csLapiSecret | quote }}
  registrationToken: {{ $registrationToken | quote }}
