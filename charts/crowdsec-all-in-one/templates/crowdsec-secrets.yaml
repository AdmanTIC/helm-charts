{{- /*
  crowdsec-secrets — mots de passe internes (PgBouncer, LAPI, WebUI).

  Contrainte : `helm template` (utilisé par ArgoCD pour rendre le chart) ne
  supporte PAS `lookup`, il retourne toujours nil. Avec l'ancienne version qui
  s'appuyait uniquement sur `randAlphaNum` + `lookup`, chaque sync ArgoCD
  regénérait des mots de passe DIFFÉRENTS, K8s rejetait l'update du Secret
  (immutable), la Sync main phase échouait, et les hooks PostSync ne
  tournaient jamais (pas de register-webui, pas d'install-collections, pas de
  restart-agent).

  Fix : passer à des mots de passe DÉTERMINISTES dérivés de (namespace,
  release) via sha256, tout en préservant la valeur existante quand elle est
  déjà en base (via `lookup` quand disponible — `helm install/upgrade` CLI).
  Résultat :
    • Contenu du Secret STABLE entre chaque render → sync ArgoCD OK
    • Sur le 1er install CLI (lookup ok), on peut choisir des passwords
      random via `--set secrets.overrides.*` si voulu (opt-in)
    • Rotation manuelle possible : supprimer le Secret côté cluster puis
      re-sync → deterministic recompute (même valeurs, safe)

  Note sur la sécurité : les passwords sont dérivés d'un couple
  (namespace, release) — quelqu'un qui connaît ces deux valeurs peut recalculer
  les hashes. C'est acceptable pour une stack interne au cluster (les Secrets
  eux-mêmes sont déjà accessibles à quiconque a le RBAC pour les lire). Pour
  du hardened, fournir des mots de passe explicites via `secrets.overrides.*`
  ou remplacer le Secret par un ExternalSecret/SealedSecret.
*/}}
{{- $secretName := "crowdsec-secrets" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}

{{- $pgbouncerPass := "" -}}
{{- $crowdsecPass := "" -}}
{{- $webuiPass := "" -}}

{{- if and $existing (hasKey ($existing.data | default dict) "pgbouncerAdminPassword") -}}
  {{- /* Secret déjà en base (helm install/upgrade CLI avec accès cluster) */ -}}
  {{- $pgbouncerPass = index $existing.data "pgbouncerAdminPassword" | b64dec -}}
  {{- $crowdsecPass  = index $existing.data "crowdsecPassword"       | b64dec -}}
  {{- $webuiPass     = index $existing.data "webuiPassword"          | b64dec -}}
{{- else -}}
  {{- /* Génération déterministe : sha256("<ns>/<release>:role") tronqué à 37 chars */ -}}
  {{- $seed := printf "%s/%s" .Release.Namespace .Release.Name -}}
  {{- $pgbouncerPass = printf "%s:pgbouncer" $seed | sha256sum | trunc 37 -}}
  {{- $crowdsecPass  = printf "%s:crowdsec"  $seed | sha256sum | trunc 37 -}}
  {{- $webuiPass     = printf "%s:webui"     $seed | sha256sum | trunc 37 -}}
{{- end -}}

{{- /* Overrides explicites (opt-in) — utiles pour rotation ou passwords externes */ -}}
{{- with .Values.secrets.overrides.pgbouncerAdminPassword }}{{- $pgbouncerPass = . }}{{- end }}
{{- with .Values.secrets.overrides.crowdsecPassword       }}{{- $crowdsecPass  = . }}{{- end }}
{{- with .Values.secrets.overrides.webuiPassword          }}{{- $webuiPass     = . }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels: {}
  annotations:
    # Ne jamais supprimer ce Secret (helm uninstall, argocd prune).
    "helm.sh/resource-policy": keep
    "argocd.argoproj.io/sync-options": Prune=false
type: Opaque
stringData:
  pgbouncerAdminUser: pgbouncer_auth
  pgbouncerAdminPassword: {{ $pgbouncerPass | quote }}
  userlist.txt: |
    "pgbouncer_auth" "{{ $pgbouncerPass }}"
    "crowdsec" "{{ $crowdsecPass }}"
  crowdsecUsername: crowdsec
  crowdsecPassword: {{ $crowdsecPass | quote }}
  webuiUsername: crowdsec-web-ui
  webuiPassword: {{ $webuiPass | quote }}
