{{- if .Values.calicoBouncer.enabled -}}
{{- $secretName := "crowdsec-calico-bouncer-secret" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $apiKey := "" -}}
{{- if $existing -}}
  {{- $apiKey = index $existing.data "apiKey" | b64dec -}}
{{- else -}}
  {{- $apiKey = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "calicoBouncer.labels" . | nindent 4 }}
  annotations:
    # Generated once at first install, then preserved across upgrades / prune.
    "helm.sh/resource-policy": keep
    "argocd.argoproj.io/sync-options": Prune=false
type: Opaque
stringData:
  apiKey: "{{ $apiKey }}"
{{- end }}
