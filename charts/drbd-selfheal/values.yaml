# Détection et auto-guérison des défauts de resynchronisation DRBD (établis sur 9.3.3) :
# resynchronisation calée et bitmap périmé entre deux répliques UpToDate.
#
# 🛑 LIVRÉ EN MODE OBSERVATION (`controller.dryRun: true`) : le balayeur détecte, journalise,
# publie ses métriques et alerte, mais n'exécute AUCUN `drbdadm`. L'armement
# (`controller.dryRun: false`) est une décision d'exploitation, à prendre après avoir vu ses
# verdicts sur des cas réels du cluster visé.

# ⚠️ TOUT EST DÉPOSÉ DANS LE NAMESPACE DES SATELLITES LINSTOR, et non dans un namespace
# dédié — c'est une contrainte, pas une préférence : le balayeur doit `exec` dans les pods
# satellites, et un `Role` namespacé y suffit là où un namespace séparé imposerait un
# `ClusterRole`. Le Pushgateway y est déposé pour la même raison — un cloisonnement réseau
# par défaut (NetworkPolicy de refus) laisse alors le trafic intra-namespace passer sans
# règle supplémentaire.
#
# Vide = namespace de la release. Renseigner cette valeur uniquement si les manifestes
# doivent atterrir ailleurs que là où Helm/Argo CD installe la release — auquel cas ce
# namespace doit rester CELUI DES SATELLITES.
#
# ⚠️ Ce namespace est en général créé par l'installation de l'opérateur Piraeus, pas par ce
# chart : ne pas l'assortir d'une création automatique (`CreateNamespace=true` côté Argo CD)
# si un autre outil en a la propriété.
namespace: ""

# ─── Placement ───────────────────────────────────────────────────────────────
#
# Vides par défaut : le chart ne présume AUCUNE convention de labels ni de taints de nœuds.
# Le balayeur et son puits joignent les satellites par l'API Kubernetes — ils n'ont aucune
# raison d'occuper un nœud de stockage, mais rien ne les y contraint non plus.
#
# Sur un cluster dont les nœuds portent des rôles, y épingler les deux pods, p. ex. :
#   nodeSelector:
#     node-role.kubernetes.io/worker: ""
nodeSelector: {}
tolerations: []
affinity: {}

# ─── Collecte ────────────────────────────────────────────────────────────────
#
# `drbd-reactor` tourne DÉJÀ dans chaque pod satellite Piraeus avec son plugin prometheus
# actif (`address = ":9942"`, `enums = true`, port nommé `prometheus`). Il ne manque, en
# général, que la collecte : l'installation par défaut ne pose ni Service, ni ServiceMonitor,
# ni PodMonitor devant ce port.
collecte:
  # Sélecteur des pods satellites.
  satelliteSelector:
    app.kubernetes.io/component: linstor-satellite
  # Port NOMMÉ dans le pod : d'où le PodMonitor, qui dispense de créer un Service.
  portName: prometheus
  interval: 30s
  # 🛑 LABELS QUE L'OPÉRATEUR PROMETHEUS EXIGE POUR RETENIR LES OBJETS. Le
  # `podMonitorSelector` / `serviceMonitorSelector` / `ruleSelector` du Prometheus en place
  # les impose : sans eux, PodMonitor, ServiceMonitor et PrometheusRule sont créés, acceptés,
  # et purement et simplement IGNORÉS — aucune erreur nulle part.
  #
  # Vide = aucun label ajouté, ce qui convient à un Prometheus dont les sélecteurs sont
  # ouverts. kube-prometheus-stack, lui, retient par défaut `release: <nom de la release
  # kube-prometheus-stack>` :
  #   prometheusLabels:
  #     release: kube-prometheus-stack
  prometheusLabels: {}

# ─── Puits de métriques du balayeur ──────────────────────────────────────────
#
# Un CronJob est éphémère : il n'est pas scrutable. Ses verdicts sont donc POUSSÉS sur un
# Pushgateway, dont la sémantique convient exactement — le dernier groupe poussé persiste,
# l'alerte tient donc pendant les 5 minutes où aucun job ne tourne, et une paire rétablie
# disparaît d'elle-même au push suivant.
pushgateway:
  enabled: true
  image: quay.io/prometheus/pushgateway:v1.11.3
  port: 9091

# ─── Balayeur ────────────────────────────────────────────────────────────────
controller:
  # Image NUE : le script tient dans la bibliothèque standard, y compris la bascule
  # WebSocket de l'API `exec`. Aucun paquet installé au démarrage — le job tourne 288 fois
  # par jour.
  image: python:3.13-alpine

  # 🛑 ARMEMENT DU BALAYEUR. `true` = détecte, journalise, publie, n'agit pas.
  # `false` = exécute réellement `drbdadm disconnect`/`connect`.
  #
  # ⚠️ Le passage à `false` est une DÉCISION D'EXPLOITATION : ne l'engager qu'après avoir
  # confronté, sur le cluster visé, les verdicts du mode observation aux journaux des jobs et
  # à l'alerte `DrbdSelfHealDetecteSansAgir`. Une fois armé, veiller à ne pas revenir à `true`
  # par inadvertance : cela DÉSARMERAIT le déblocage automatique sans que rien ne le signale.
  dryRun: true

  # Cycle de balayage. 5 min : chaque exécution ne prouve rien à elle seule, la preuve de
  # stagnation se construit sur PLUSIEURS exécutions (voir `seuils` ci-dessous).
  schedule: "*/5 * * * *"

  # 🛑 `Forbid` : deux balayeurs concurrents pourraient agir deux fois sur la même paire.
  concurrencyPolicy: Forbid

  # Ordre de grandeur mesuré : 60 s d'attente + (nombre de satellites × `sampleCount` relevés
  # × ~0,4 s d'`exec`) — soit ≈ 66 s pour une douzaine de satellites, donc une marge de 1,8×.
  # ⚠️ À relever sur un cluster nettement plus large. Le script s'impose lui-même
  # `budgetSeconds` pour sortir PROPREMENT — donc en journalisant et en publiant — plutôt que
  # d'être tué par le kubelet.
  activeDeadlineSeconds: 120
  budgetSeconds: 105

  # 🛑 `backoffLimit: 0` : un job en échec ne réessaie pas, il laisse passer le cycle. Un
  # balayage dégradé ne doit ni agir ni casser une série en cours — le pire qu'il puisse
  # faire est de RETARDER une action.
  backoffLimit: 0

  # Historique de jobs conservé par le CronJob.
  #
  # ⚠️ Ce sont les jobs RÉUSSIS qu'on vient lire, en mode observation comme après armement :
  # eux seuls portent les lignes `VERDICT …`, donc les décisions à confronter avant d'armer le
  # balayeur. D'où un historique de succès plus PROFOND que celui des échecs — 15 succès à
  # raison d'un cycle de 5 min font 1 h 15 de verdicts consultables.
  #
  # Un job en échec, lui, n'a produit aucun verdict : il n'apprend que la panne elle-même, et
  # 5 suffisent à la caractériser.
  successfulJobsHistoryLimit: 15
  failedJobsHistoryLimit: 5

  # Fenêtre d'échantillonnage interne au job, et nombre de relevés qui s'y répartissent.
  #
  # 60 s est généreux, sciemment : à `c-min-rate=51200k` (50 Mio/s), une resynchronisation
  # saine déplace 3 Gio en 60 s, et même à 1 % de ce plancher elle en déplace 30 Mio — elle
  # ne peut pas paraître figée. 20 s suffiraient ; l'attente ne coûte rien puisque les
  # `exec` s'y fondent, et les 5 relevés protègent d'une lecture aberrante isolée.
  sampleWindowSeconds: 60
  sampleCount: 5
  execTimeoutSeconds: 8

  seuils:
    # DÉFAUT 1 — resynchronisation calée. Deux exécutions concordantes couvrent
    # 0 → 360 s, soit 6 min de stagnation PROUVÉE : la valeur ABSOLUE de `received`,
    # identique aux deux bouts, établit qu'aucun octet n'a circulé pendant les 4 minutes
    # aveugles entre les jobs ET qu'aucune reconnexion n'a eu lieu — elle remettrait ce
    # compteur à zéro.
    #
    # Les DEUX conditions valent. La durée prouvée rend le calibrage honnête si un cycle a
    # été manqué : le nombre d'exécutions seul mentirait.
    stalledMinStreak: 2
    stalledMinProvenSeconds: 300

    # DÉFAUT 2 — bitmap périmé entre deux pairs UpToDate. Quatre exécutions couvrent
    # 0 → 960 s, soit 16 min. Ici `received` avance légitimement (réplication normale) :
    # l'invariant est `out-of-sync`, qui ne CROÎT jamais entre deux pairs connectés dont les
    # écritures sont acquittées de façon synchrone : constant au repos, décroissant sous les
    # écritures applicatives (elles effacent leurs bits sur les deux pairs). Une hausse rompt
    # la série. Une reconnexion survenue dans l'intervalle aurait purgé le bitmap, donc cassé
    # la série d'elle-même.
    staleBitmapMinStreak: 4
    staleBitmapMinProvenSeconds: 900

  # Défauts sur lesquels le balayeur agira UNE FOIS ARMÉ (sans effet tant que `dryRun`).
  #
  # Le défaut 2 met en jeu deux répliques UpToDate, donc apparemment saines. Le risque est
  # borné : à la reconnexion DRBD compare les UUID courants et, s'ils concordent — ce que le
  # journal noyau permet de vérifier — purge le bitmap sans transférer un octet. S'ils
  # divergent réellement, les politiques `after-sb-*` par défaut laissent la connexion en
  # `StandAlone` plutôt que d'écraser silencieusement un côté.
  actOnStalledResync: true
  actOnStaleBitmap: true

  # 🛑 RECONSTITUER LA TRACE APRÈS L'AVOIR PURGÉE. La renégociation purge le bitmap sans
  # transférer un octet : si les bits étaient RÉELS, la divergence survit, invisible, les deux
  # répliques se déclarant `UpToDate`. Le balayeur lance donc une vérification en ligne APRÈS
  # son action. Le bitmap étant purgé, cette vérification repart propre : elle redécouvre ce
  # qui diverge vraiment et le remarque, et l'alerte `DrbdSelfHealDivergenceReelle` porte le
  # constat à un humain — car la vérification DÉTECTE, elle ne répare pas.
  #
  # ⚠️ L'ORDRE INVERSE — vérifier AVANT d'agir — a été essayé, puis ABANDONNÉ : il ne peut pas
  # fonctionner. Sur un bitmap DÉJÀ sale, `drbdadm verify` ré-annonce les bits
  # posés. Deux vérifications successives ont rendu « found 16 4k blocks out of sync! » alors
  # que les empreintes md5 des deux répliques étaient IDENTIQUES sur la région visée. Le signal
  # ne vaut que si le bitmap était propre AVANT — or le défaut 2 est par définition un bitmap
  # déjà sale. Une barrière préalable aurait refusé indéfiniment, rendant le composant inerte.
  #
  # ⚠️ `has-online-verify-details` ne remplace rien non plus : ce drapeau retombe à faux dès la FIN de la vérification alors que les bits sales subsistent. Il ne
  # couvre donc que la durée du verify, fenêtre déjà couverte par `repl != Established`.
  #
  # Coût : une vérification de quelques minutes après chaque intervention (241 s pour 10 GiB,
  # 5 s pour 1 GiB, mesurés), sans retarder l'action.
  verifyAfterAct: true

  # 🛑 RESOURCES ORPHELINES — portées par le noyau, oubliées de LINSTOR. Le balayeur compare, sur
  # chaque satellite, ce que `drbdsetup status` rapporte avec les fichiers `<resource>.res` que
  # LINSTOR dépose dans `/var/lib/linstor.d`. Un écart signale une resource que plus personne ne
  # réconcilie.
  #
  # Cas observé : la suppression d'une ligne interne de la base LINSTOR laisse sur un nœud une
  # resource encore présente dans le noyau, `StandAlone` vers ses pairs, sans quorum, E/S
  # suspendues, indéfiniment. Les alertes de santé se déclenchent alors sur ses SYMPTÔMES sans
  # qu'aucune ne la nomme. Et l'enjeu dépasse le bruit : un pod planifié sur ce nœud verrait le
  # CSI demander une resource du même nom, à laquelle ce fantôme s'opposerait.
  #
  # ⚠️ CONSTAT SEUL, JAMAIS D'ACTION. `drbdsetup down` sur une resource réellement utilisée
  # couperait un volume vivant, et le balayeur ne peut pas distinguer « oubliée » de « en cours
  # de création ». Le retrait reste un geste humain — et il passe par `drbdsetup`, pas
  # `drbdadm`, qui refuse ce qu'il ne trouve plus dans sa configuration.
  detectOrphanResources: true
  # Au-delà de cet âge, un constat de divergence cesse d'être publié : il a été vu, ou il ne le
  # sera pas. Calé sur `pairCooldownSeconds`.
  verifyResultMaxAgeSeconds: 3600
  # Une vérification qui ne se lance pas ou ne conclut pas dans ce délai est abandonnée, avec
  # une trace au journal.
  verifyDeadlineSeconds: 3600

  gardeFous:
    # Une action par paire et par heure : laisse le temps à la resynchronisation relancée
    # d'aboutir avant toute nouvelle tentative.
    pairCooldownSeconds: 3600
    # Plafond global, contre l'emballement : au-delà, c'est un défaut systémique qui relève
    # de l'humain, pas d'un automate.
    globalMaxActions: 3
    globalWindowSeconds: 600

  # Resources que le balayeur ne doit jamais toucher, par nom DRBD exact.
  #
  # 🛑 UTILISER L'EXCLUSION, ET NON `dryRun: true`, POUR MENER UNE CAMPAGNE D'ESSAIS SUR UN
  # BALAYEUR ARMÉ. L'exclusion est un garde-fou : la DÉTECTION reste entière — journal,
  # `drbd_selfheal_detected`, `drbd_selfheal_blocked{reason="resource_exclue"}`, alertes — et
  # seule l'ACTION est retenue. On lit donc le verdict du balayeur sans le payer, là où
  # `dryRun: true` désarmerait le balayeur pour TOUT le cluster pendant toute la campagne.
  #
  # ⚠️ Une resource d'essai gagne à être créée sous un NOM LINSTOR EN CLAIR plutôt que comme
  # PVC : un `pvc-<uid>` est tiré au hasard à la création, donc l'exclusion ne pourrait être
  # écrite qu'APRÈS coup — l'inverse de ce qu'il faut. Un nom qui ne correspond à aucune
  # resource rapportée par `drbdsetup status` est simplement sans effet.
  excludedResources: []

  # ConfigMap portant les séries entre deux exécutions.
  #
  # 🛑 `data.state.json` EST ÉCRIT À L'EXÉCUTION, donc en écart permanent avec le manifeste.
  # Sous un déploiement réconcilié en continu (Argo CD, Flux), il faut EXCLURE ce champ de la
  # synchronisation, pas seulement de la comparaison. Côté Argo CD, cela suppose les deux à la
  # fois : un `ignoreDifferences` sur `/data/state.json` ET l'option de synchronisation
  # `RespectIgnoreDifferences=true`. Sans la seconde, la synchronisation réapplique le
  # manifeste — donc remet l'état à vide, et le balayeur n'atteint JAMAIS ses seuils.
  stateConfigMap: drbd-selfheal-state

# ─── Tableau de bord ─────────────────────────────────────────────────────────
#
# Chargé par le sidecar `grafana-sc-dashboard` (kube-prometheus-stack) : un ConfigMap portant
# le bon label suffit. ⚠️ Si ce sidecar tourne avec `NAMESPACE` restreint à celui de Grafana
# plutôt qu'en `NAMESPACE=ALL`, ce ConfigMap ne sera pas vu depuis le namespace des
# satellites — mettre alors `dashboard.enabled: false` et déposer le tableau de bord
# autrement.
#
# Les séries y prennent `palette-classic-by-name` : Grafana affecte alors la teinte d'après le
# NOM de la série et non son rang, donc un filtre de volume ne repeint pas les paires
# survivantes. Les seules couleurs choisies à la main sont celles d'état — et elles
# accompagnent toujours un libellé, jamais la couleur seule.
dashboard:
  enabled: true
  sidecarLabel: grafana_dashboard
  sidecarLabelValue: "1"

# ─── Alertes ─────────────────────────────────────────────────────────────────
alertes:
  enabled: true

  # Runbook cité par les alertes : chemin de document, URL, ticket… Vide = les descriptions
  # renvoient à « le runbook d'exploitation » sans lien, et l'annotation `runbook` est omise.
  runbook: ""

  # ⚠️ Les deux alertes de défaut sont un FILET DE SÉCURITÉ, pas le détecteur principal.
  # `drbd-reactor` n'exportant ni l'état de réplication ni l'état de disque du pair, elles ne
  # peuvent que s'en approcher : « disque local Inconsistent + Connected + out-of-sync > 0 +
  # aucune progression » au lieu de « replication:SyncTarget ». Le verdict fin appartient au
  # balayeur, qui lit `drbdsetup`. Ces alertes existent pour le cas où LE BALAYEUR LUI-MÊME
  # serait en panne — d'où leur maintien malgré la redondance.

  # Fenêtre sur laquelle l'absence de progression de `received` est constatée. Cumulée au
  # `for:` ci-dessous, la preuve porte sur ~15 min — délibérément plus lent que les 6 min du
  # balayeur, dont les critères sont bien plus riches.
  resyncFigeeProgressionWindow: 10m
  resyncFigeeFor: 5m
  bitmapDivergentFor: 15m
  connexionDegradeeFor: 10m
  quorumPerduFor: 5m

  # E/S SUSPENDUES — le PIRE dénouement : le fil LINBIT 1169 décrit un blocage TOTAL des E/S,
  # constaté en pratique sous la forme `suspended:quorum`, `blocked:upper`. 5 min pour absorber
  # les suspensions légitimes pendant une rotation de nœuds, où le quorum se recalcule.
  esSuspenduesFor: 5m

  # RESOURCE ORPHELINE. 15 min : une création ou une suppression LINSTOR normale comporte une
  # fenêtre où le fichier de configuration et l'objet noyau ne sont pas encore d'accord. Un
  # résidu réel, lui, dure des heures : ce délai ne coûte aucune détection.
  orphelineFor: 15m

  # RÉPLIQUE QUI A TOUT REÇU MAIS NE PASSE JAMAIS `UpToDate` — `Inconsistent` avec un bitmap à
  # zéro. C'est la signature du verrou analysé par `kvaps` sur drbd#40 : la resynchronisation
  # est suspendue derrière une dépendance de connexion, `out-of-sync` se vide, et le disque
  # reste `Inconsistent` indéfiniment.
  #
  # 🛑 ALERTE SEULE, JAMAIS D'ACTION. `kvaps` a établi qu'AUCUN déblocage ne fonctionne :
  # ni `disconnect`/`connect` de la source, ni du pair diskless, ni `invalidate`, ni
  # `down`/`up`, ni `pause-sync`/`resume-sync`. Agir ne ferait que consommer les plafonds de
  # fréquence pour rien. Le balayeur l'écarte d'ailleurs deux fois — il exige
  # `out-of-sync > 0` ET `resync-suspended:no`.
  #
  # 15 min : la queue d'une resynchronisation légitime peut brièvement montrer un bitmap à zéro
  # avant que le disque ne bascule `UpToDate`.
  inconsistanteSansDivergenceFor: 15m

  # Au-delà, le balayeur est considéré muet : plus de 3 cycles de 5 min manqués.
  balayeurMuetSeconds: 1200
  # Garde de FRAÎCHEUR des métriques du balayeur. Le Pushgateway conserve le dernier groupe
  # poussé : sans cette garde, un verdict périmé alerterait indéfiniment après la mort du
  # producteur.
  fraicheurVerdictSeconds: 900
