{{- /*
Branchement de la collecte sur un endpoint qui EXISTE DÉJÀ : `drbd-reactor` tourne dans
chaque pod satellite, plugin prometheus actif, port nommé `prometheus`. L'installation par
défaut de Piraeus ne pose, elle, aucun collecteur devant ce port — ni Service, ni
ServiceMonitor, ni PodMonitor.

Un PodMonitor suffit, le port étant nommé : pas de Service à créer.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: drbd-satellites
  namespace: {{ include "drbd-selfheal.namespace" . }}
  {{- /* 🛑 Sans les labels attendus, le `podMonitorSelector` du Prometheus en place ne
  retient pas l'objet : il est créé, accepté, et IGNORÉ, sans erreur nulle part. */}}
  {{- with .Values.collecte.prometheusLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
{{ toYaml .Values.collecte.satelliteSelector | indent 6 }}
  podMetricsEndpoints:
    - port: {{ .Values.collecte.portName }}
      interval: {{ .Values.collecte.interval }}
      relabelings:
        # 🛑 INDISPENSABLE, ET PAS COSMÉTIQUE. Les métriques de `drbd-reactor` portent le PAIR
        # (`conn_name`) mais JAMAIS le nœud local : rien ne dit d'où la mesure est prise. Or
        # `out-of-sync` est ASYMÉTRIQUE : un nœud peut annoncer des centaines de Mio divergents
        # quand son pair en annonce 0.
        #
        # Ce label est aussi ce qui rend possible l'alerte « bitmap divergent entre deux pairs
        # UpToDate » : `drbd-reactor` n'exporte pas l'état de disque du PAIR, il faut donc
        # joindre la vue d'un nœud à celle de l'autre, `conn_name` d'un côté contre `node` de
        # l'autre. Sans ce label, cette alerte est inécrivable.
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace
