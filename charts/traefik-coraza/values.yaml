# =============================================================================
#  traefik-coraza — values
# =============================================================================
#  Chaque réglage de la section `traefik:` corrige un échec constaté en cluster,
#  et le commentaire qui l'accompagne dit lequel. Plusieurs sont contre-intuitifs.
#  Les valeurs marquées ⚠️ ne sont pas vérifiées : les confirmer, ne pas les
#  propager comme des faits.
#
#  ⚠️ IMAGE DU WAF : LE TAG EST ÉCRIT DEUX FOIS, C'EST VOLONTAIRE
#     Une fois dans `traefik.deployment.initContainers` (patch du Caddyfile) et
#     une fois dans `traefik.deployment.additionalContainers` (sidecar qui le
#     consomme). Les deux doivent porter le MÊME tag : sinon l'initContainer
#     patcherait un template issu d'une version différente de celle qui le lit.
#
#     Il n'y a pas de valeur unique possible. Le chart Traefik rend ces deux
#     tableaux avec `toYaml` SANS `tpl`, donc aucune valeur du parent ne peut les
#     alimenter, et le sidecar doit rester dans le pod Traefik pour joindre
#     l'entrypoint loopback.
#
#     Corollaires, à connaître avant de surcharger depuis ArgoCD ou `-f` :
#       - il n'y a rien à surcharger « en un point » ;
#       - Helm REMPLACE les listes au lieu de les fusionner, donc un tableau
#         partiel (`--set …additionalContainers[0].image=…`) supprime tout le
#         reste du sidecar : name, env, volumeMounts, NET_BIND_SERVICE.
#     Voie normale : éditer les deux tags ici et bumper `version` dans Chart.yaml.
#     NOTES.txt affiche les deux au déploiement et signale toute divergence.
#
#     L'initContainer `caddy-plugin-build` fait exception : il utilise l'image
#     OFFICIELLE `caddy:<version>-builder`, dont le tag suit la version de Caddy
#     et non celle du CRS. Il doit rester aligné sur la version de Caddy de
#     l'image du WAF, pas sur son tag.
# =============================================================================

# -----------------------------------------------------------------------------
#  WAF — objets créés par CE chart
# -----------------------------------------------------------------------------
coraza:
  # Port d'écoute du sidecar Caddy/Coraza dans le pod Traefik.
  port: 8090

  # ⚠️ Nom FIXE, non préfixé par le release : référencé *littéralement* dans
  #    `traefik.deployment.additionalVolumes` ci-dessous, parce que les values
  #    d'un subchart ne passent pas par le moteur de template.
  #    Le changer ici impose de le changer là-bas aussi.
  configMapName: coraza-config

  # --- page servie sur refus du WAF ------------------------------------------
  # Un refus de Coraza remonte par le chemin d'erreur de Caddy, donc
  # `handle_errors` l'attrape. L'initContainer y injecte un bloc
  # `handle_errors 403` qui sert le fichier ci-dessous depuis
  # /opt/coraza/errorpages.
  #
  # Portée exacte, mesurée sur banc avec l'image du sidecar :
  #   - refus en phase 1 ou 2 (règle explicite ET score d'anomalie CRS) → page ✅
  #   - 403 émis par l'application derrière le WAF → INTACT, l'appli garde le
  #     sien (une réponse amont n'est pas une erreur Caddy) ✅
  #   - backend injoignable (502) → page Caddy par défaut, le `403` du
  #     `handle_errors` la met hors de portée ✅
  #   - refus en phase 3 ou 4 (côté réponse) → PAS de page : les en-têtes sont
  #     déjà partis, le client reçoit une connexion coupée. Sans remède ici, et
  #     sans conséquence pratique : les faux positifs que rencontre un humain
  #     sont tous côté requête.
  #
  # 🛑 Pour revenir à la page par défaut de Caddy, il ne suffit PAS de vider
  #    `html` : retirer la stanza `handle_errors` de l'awk de l'initContainer ET
  #    son `grep -q` de garde. Ces deux tableaux sont rendus par le chart
  #    Traefik avec `toYaml` SANS `tpl` — aucune value ne peut les conditionner.
  errorPage:
    # ⚠️ Nom FIXE, non préfixé par le release : référencé *littéralement* dans
    #    `traefik.deployment.additionalVolumes` et dans le `volumeMounts` du
    #    sidecar. Le changer ici impose de le changer aux deux endroits.
    configMapName: coraza-errorpages

    # Page complète, en un seul fichier. Vide → celle livrée par le chart
    # (files/error-403.html), volontairement neutre et sans marque.
    #
    # La page est rendue comme un template Go par le module `templates` de
    # Caddy. Placeholders utiles, tous résolus côté serveur :
    #   {{.ClientIP}}  IP réelle du client (celle de la ligne d'audit Coraza)
    #   {{.RemoteIP}}  IP du pair TCP, donc Traefik — sans intérêt ici
    #   {{.Req.Host}}  hôte demandé
    # 🛑 Tout autre `{{` est une erreur de rendu, donc un 500 à la place du 403.
    #    Le chart refuse de rendre plutôt que de laisser partir ça en production.
    #
    # Tout doit être EN LIGNE — CSS, images en data: URI. Le client qui reçoit
    # ce refus n'obtiendra pas davantage une feuille de style ou un logo servis
    # à part : ils repasseraient par le WAF, et rien ne dit qu'ils passeraient.
    html: ""

  service:
    # Pour un ExternalName, le nom du Service n'a aucun effet sur le routage :
    # seul son `externalName` compte. Il reste le nom référencé par l'IngressRoute.
    name: coraza

    # externalName : Service ExternalName → `localhost`. Traefik résout 127.0.0.1,
    #                la requête ne quitte jamais le pod : le hop inter-nœuds est
    #                supprimé, pas seulement raccourci.
    #                Requiert providers.kubernetesCRD.allowExternalNameServices.
    #                ⚠️ ce flag est cluster-wide : tout IngressRoute pourra
    #                proxifier vers un hôte arbitraire → restreindre la création
    #                d'IngressRoute par RBAC ou policy.
    #                ⚠️ pas d'endpoints → la readiness du sidecar ne gate plus le
    #                routage (502 au lieu d'un retrait d'endpoint). Le fail-closed
    #                est préservé, la dégradation est juste moins propre.
    # clusterIP    : variante sans le flag. Requiert `nativeLB: true` côté
    #                IngressRoute (posé automatiquement) pour cibler le ClusterIP
    #                au lieu des endpoints, sans quoi internalTrafficPolicy n'est
    #                jamais consulté. Garde la readiness comme gate, au prix d'un
    #                passage par iptables/nftables et d'un réglage à deux endroits.
    mode: externalName

    # Mode clusterIP uniquement. Doit sélectionner les pods Traefik.
    # Par défaut : app.kubernetes.io/name=traefik + instance=<release>-<namespace>.
    # ⚠️ confirmer avec `kubectl get pod -n <ns> --show-labels`.
    selector: {}

  # --- inspection des réponses (phase 4) -------------------------------------
  # ✅ RÉGLÉ EN AMONT. coreruleset/coraza-crs-docker#78 a été fusionnée le
  # 2026-08-26 : `caddy/Dockerfile` déclare enfin `ARG CORAZA_VERSION` et
  # construit `coraza-caddy/v2@${CORAZA_VERSION}`. L'image épinglée ci-dessous
  # (tag `…-202608260808`, construite le 2026-08-26 à 21:30 UTC, donc APRÈS la
  # fusion) embarque coraza-caddy/v2 v2.5.0 et coraza v3.7.0 — vérifié par
  # `caddy build-info`. La phase 4 s'exécute, RESPONSE_BODY est lu, les entrées
  # d'audit `"transaction"` sont produites.
  #
  # Le même commit a retiré le `tag:'${CORAZA_TAG}'` des SecDefaultAction par
  # défaut de l'image : la contournement par variables d'environnement du
  # sidecar (plus bas) n'est plus nécessaire, il est conservé comme filet.
  #
  # ⚠️ L'initContainer `caddy-plugin-build` reste néanmoins EN PLACE, mais pour
  #    une autre raison, et une seule : la version que l'image épingle
  #    (coraza-caddy v2.5.0) retient toutes les réponses en flux et casse les
  #    WebSocket. Voir les deux sections suivantes. Le jour où l'image livrera
  #    coraza-caddy >= v2.7.0 (une fois corazawaf/coraza-caddy#344 publiée),
  #    l'initContainer, le volume `caddy-bin` et ses deux montages pourront
  #    disparaître : README § « Le jour où l'image suffira ».
  #
  # ⚠️ Ce que coûte cet initContainer, tant qu'il est là :
  #    - le démarrage du pod est allongé de la compilation : ~2 min mesurées
  #      caches vides, 1 CPU, sur l'image builder officielle ;
  #    - le nœud doit joindre le proxy de modules Go au démarrage. Sans réseau,
  #      l'initContainer échoue et le pod ne démarre pas — donc plus d'ingress
  #      sur ce nœud. Échec bruyant, pas de WAF silencieusement désactivé ;
  #    - la compilation consomme CPU et mémoire au démarrage.

  # --- réponses en flux (SSE, grpc-gateway) : LA raison qui reste ------------
  # C'est le SEUL défaut que l'image officielle ne corrige toujours pas, et donc
  # la seule justification de l'initContainer de compilation. Constaté en
  # cluster — UI Argo CD figée, `DownstreamContentSize` à 0 o côté websecure sur
  # 26 requêtes `/api/v1/stream/…` abouties en 200 — puis reproduit sur banc.
  # Trois défauts se superposaient à l'origine ; deux sont réglés :
  #
  #  1. ✅ coraza-caddy v1.2.2 bufferisait SANS consulter `responseBodyAccess`
  #     (décision prise sur le seul Content-Type, tampon recopié après la fin de
  #     la réponse amont — donc jamais pour un flux sans fin). La règle id:1003
  #     livrée ci-dessous ne protégeait RIEN. Réglé : l'image embarque
  #     désormais coraza-caddy/v2, id:1003 est honorée.
  #  2. ❌ NON RÉGLÉ — coraza-caddy v2.5.0 ET v2.6.0 ne propagent AUCUN flush :
  #     `rwInterceptor.Flush()` teste `i.w.(http.Flusher)`, alors que Caddy
  #     n'implémente plus `Flush()` sur ses ResponseWriter depuis 2.6.3
  #     (`caddyhttp.responseRecorder` expose `FlushError()`,
  #     `ResponseWriterWrapper` seulement `Unwrap()`). L'assertion échoue
  #     TOUJOURS : tout flux traversant coraza_waf est retenu jusqu'à la fin de
  #     la réponse, même quand le WAF ne le bufferise pas, et le
  #     `flush_interval` de la ReverseProxy n'y change rien.
  #     Correctif amont EN COURS : corazawaf/coraza-caddy#344, ouverte le
  #     2026-08-26, qui passe par `http.NewResponseController` — le même
  #     correctif d'une ligne que celui appliqué ici. En attendant sa
  #     publication, `caddy-plugin-build` l'applique sur une copie locale.
  #  3. ✅ le template amont pose `read_timeout ${PROXY_TIMEOUT}` (60 s par
  #     défaut) sur le transport du reverse_proxy, et Caddy réarme ce délai
  #     avant CHAQUE lecture amont : un flux silencieux plus de 60 s est coupé —
  #     « i/o timeout » côté Caddy, comme observé en cluster. Levé par
  #     `read_timeout 0`, injecté par `caddy-template-patch` (le template amont
  #     est inchangé dans la nouvelle image : vérifié par diff).
  #
  # Banc : amont émettant une ligne JSON par seconde, en chunked, sans
  # Content-Length — la forme exacte des réponses grpc-gateway d'Argo CD ;
  # lecture socket brute horodatée côté client.
  #
  #   | chaîne                          | flux          | WebSocket |
  #   |---------------------------------|---------------|-----------|
  #   | Caddy sans coraza_waf           | 1 ligne/s     | ok        |
  #   | v1.2.2 (ancienne image)         | tout à la fin | ok        |
  #   | v2.5.0 (image officielle 08-26) | tout à la fin | CASSÉ     |
  #   | v2.6.0 vierge                   | tout à la fin | ok        |
  #   | v2.6.0 + patch flush (ce chart) | 1 ligne/s     | ok        |
  #   | + read_timeout 0                | survit à 70 s de silence  |
  #
  # ⚠️ Le discriminant n'est PAS la nature SSE de la réponse. Argo CD répond
  #    `Content-Type: application/json` à un client qui demande
  #    `Accept: text/event-stream` (grpc-gateway) : ce qui déclenche la
  #    bufferisation est l'appartenance du Content-Type de la RÉPONSE à
  #    `responseBodyMimeType`. Un correctif conditionné au Content-Type de la
  #    réponse ne rattraperait pas Argo CD, et retirer `application/json` de la
  #    liste renoncerait à l'inspection de toutes les réponses JSON. D'où
  #    id:1003, qui travaille sur la REQUÊTE.
  # ⚠️ Sans l'en-tête `Accept` (donc sans id:1003), un flux JSON reste bufferisé
  #    et inspecté : ces correctifs ne désarment aucune inspection. C'est le
  #    test de non-régression à rejouer à chaque bump de version — procédure
  #    dans README § « Réponses en flux ».

  # --- bascule de protocole (WebSocket) --------------------------------------
  # ✅ RÉGLÉ EN AMONT, par le choix de version ci-dessous. coraza-caddy v2.5.0 —
  # celle qu'épingle l'image officielle — casse les WebSocket : le handshake ne
  # reçoit jamais sa ligne de statut, le client attend puis expire.
  # `rwInterceptor.WriteHeader()` se contente d'enregistrer le statut, il n'est
  # écrit en aval qu'au premier `Write()` (pour laisser une phase 4 le
  # remplacer) ; or sur un 101 `reverse_proxy` détourne la connexion (`Hijack`)
  # juste après, aucun `Write()` ne suit jamais, et le 101 meurt dans
  # l'intercepteur.
  #
  # corazawaf/coraza-caddy#262 (« fix: support WebSocket connections when WAF is
  # active ») corrige exactement cela, et va plus loin que le patch que ce chart
  # avait été écrit ici : un `hijackerTracker` marque la connexion détournée, ce qui
  # évite en plus le « response.WriteHeader on hijacked connection » du
  # post-traitement. Livré dans **v2.6.0** (2026-08-24) — d'où le choix de cette
  # version dans `caddy-plugin-build`, plutôt que le v2.5.0 de l'image. Le patch
  # maison a été retiré : il n'y a rien à reverser en amont, c'était un défaut
  # générique, déjà corrigé là-bas.
  #
  # ⚠️ Le sens de la contrainte s'est inversé : ce n'est plus « /v2 casse les
  #    WebSocket » mais « rester sur le v2.5.0 de l'image les casserait ».
  #    Ne pas revenir en arrière sur la version du module sans rejouer le test.
  #
  # Ce qui reste inspecté, vérifié sur banc :
  #   - le handshake est une requête HTTP ordinaire → phases 1 et 2 pleines
  #     (règle piège en `deny` sur l'URI du handshake : 403 rendu) ;
  #   - une réponse normale reste bufferisée et inspectée en phase 4 (règle
  #     piège sur RESPONSE_BODY : 406 rendu) ;
  #   - le flux d'une réponse SSE reste délivré au fil de l'eau (patch de
  #     flush) ;
  #   - le tunnel qui suit le 101 échappe au WAF. Ce n'est pas un choix : après
  #     un Hijack la connexion n'est plus du HTTP, et le CRS n'a pas de règles
  #     de trames WebSocket. Ce que le WAF filtre, c'est l'accès à l'endpoint.

  # --- directives Sec* poussées dans /opt/coraza/config.d/custom.conf ---------
  # ⚠️ YAML 1.1 (celui de Helm) résout `On`, `Off`, `Yes`, `No` NON QUOTÉS en
  #    booléens. Le chart les reconvertit (helper `secFlag`), mais garder les
  #    guillemets reste la bonne habitude : c'est ce qui se lit dans le fichier
  #    qui doit correspondre à ce qui atterrit dans custom.conf.
  config:
    # Rester en DetectionOnly jusqu'à la fin du rodage des faux positifs.
    ruleEngine: DetectionOnly

    requestBodyAccess: "On"
    requestBodyLimit: 13107200
    requestBodyNoFilesLimit: 131072
    requestBodyLimitAction: ProcessPartial

    # Le sandwich rend la phase 4 ATTEIGNABLE — c'est le gain visé face à
    # ForwardAuth ou au plugin WASM. Elle n'est effective que si le binaire
    # Caddy embarque coraza-caddy >= v2, d'où l'initContainer de compilation.
    responseBodyAccess: "On"
    responseBodyMimeType: "text/plain text/html text/xml application/json"
    responseBodyLimit: 524288
    responseBodyLimitAction: ProcessPartial

    audit:
      # Point ouvert n°3 : les entrées "transaction" n'ont pas été retrouvées.
      # Basculer temporairement sur `On` pour discriminer « directive écrasée »
      # vs « sémantique RelevantOnly incomplète dans Coraza ».
      engine: RelevantOnly
      # RE2 : pas de (?!…). Tous les 5xx + tous les 4xx sauf 404.
      relevantStatus: '^(?:5\d{2}|4(?:0[0-35-9]|[1-9]\d))$'
      # ⚠️ I et E embarquent les corps de requête et de réponse → secrets, tokens
      #    et données personnelles poussés dans la stack de logs. Les retirer
      #    après le rodage, ou ajouter dans extraRules :
      #    SecAuditLogSanitizeArg password,token,authorization
      parts: ABIJEFHKZ
      target: /dev/stdout
      format: JSON

    # Sonde de diagnostic id:1099 — DOIT rester muette. Si elle se déclenche,
    # Coraza ne voit pas l'IP client réelle et toutes les règles IP du CRS ainsi
    # que les audit logs sont sans valeur. Si `client_ip` est pourtant correct
    # côté Caddy, c'est que coraza-caddy lit RemoteAddr au lieu du client résolu
    # → issue en amont, pas un réglage à faire ici.
    clientIpProbe:
      enabled: true
      privateRanges: "127.0.0.0/8,10.0.0.0/8"

    # Exclusions livrées par défaut (IDs 1000-1006), toutes en `ctl:` donc
    # évaluées à l'exécution — indispensable, config.d étant chargé AVANT le CRS.
    builtinExclusions:
      # ACME http-01 : ne jamais inspecter le challenge, cert-manager en dépend.
      acmeChallenge: true
      # WebSocket / gRPC / SSE : l'inspection de corps casse le streaming.
      # Pour une réponse HTTP en flux, ces `ctl:` n'ont d'effet qu'à partir de
      # coraza-caddy v2 ET avec le patch de flush : cf. « réponses en flux »
      # ci-dessus. Pour les WebSocket, ils ne suffisent pas non plus : ce qui
      # les débloque est coraza-caddy >= v2.6.0, cf. « bascule de protocole ».
      streamingProtocols: true
      # Sondes kubelet + Host numérique interne (neutralise 920350 sans le
      # désactiver pour l'externe, où un Host numérique reste un signal de scan).
      internalProbes: true

  # Règles maison. Plage d'ID réservée : 1000-1999 (1000-1006 et 1099 déjà pris
  # par les exclusions livrées ci-dessus). Préférer `ctl:ruleRemoveById` à
  # `SecRuleRemoveById`. Regex RE2 uniquement.
  extraRules: |
    # Gabarit — exclure une règle sur un endpoint précis :
    #SecRule REQUEST_URI "@beginsWith /api/ingest" \
    #    "id:1010,phase:1,pass,nolog,ctl:ruleRemoveById=920420"

    # --- RÈGLES DE TEST : décommenter temporairement, puis RETIRER ------------
    # Smoke test du chemin de refus : valide que le 403 se propage
    # Coraza → Traefik → client.
    # ⚠️ INOPÉRANT tant que ruleEngine vaut DetectionOnly : ce mode neutralise
    #    l'action disruptive de TOUTES les règles, y compris un `deny` explicite.
    #    Vérifié en local : la règle est bien évaluée et journalisée, mais la
    #    réponse reste 200. Pour tester le blocage, basculer ruleEngine sur "On"
    #    le temps du test.
    #   curl -o /dev/null -w '%{http_code}\n' -H 'X-WAF-Test: blockme' https://<host>/
    #SecRule REQUEST_HEADERS:X-WAF-Test "@streq blockme" \
    #    "id:1200,phase:1,deny,status:403,log,msg:'WAF smoke test'"
    #
    # Vérifie que la phase 4 lit réellement le corps de réponse. Ne matche que si
    # le Content-Type est dans SecResponseBodyMimeType — et si le binaire Caddy
    # embarque coraza-caddy >= v2 (initContainer `caddy-plugin-build`).
    #SecRule RESPONSE_BODY "@contains argo" \
    #    "id:1201,phase:4,pass,log,msg:'phase 4 OK: corps de reponse lu'"
    #
    # Réduction du bruit sur les assets statiques — NE PAS activer avant la fin
    # de l'analyse des faux positifs : supprime aussi la visibilité dessus.
    #SecRule REQUEST_URI "@rx \.(?:woff2?|ttf|eot|css|js|png|jpe?g|gif|svg|ico|map)$" \
    #    "id:1006,phase:1,pass,nolog,ctl:ruleRemoveById=980170,ctl:responseBodyAccess=Off"

# -----------------------------------------------------------------------------
#  IngressRoute catch-all
# -----------------------------------------------------------------------------
catchAll:
  enabled: true
  name: waf-catchall

  # Uniquement les entrypoints exposés au public.
  # Ne JAMAIS y ajouter `internal` → boucle infinie (le chart refuse de rendre).
  entryPoints:
    - websecure

  # Doit écraser les routers issus des Ingress applicatifs, qui s'attachent eux
  # aussi à websecure. La priorité Traefik par défaut dérive de la longueur de la
  # règle, d'où la valeur volontairement absurde.
  priority: 1000000

  # Syntaxe Traefik v3. Matche tout host, tout chemin.
  match: PathPrefix(`/`)

  # `tls: {}` → certificat résolu par SNI depuis le magasin par défaut, alimenté
  # par les blocs `tls` des Ingress, donc par cert-manager. VALIDÉ en cluster.
  # Ne pas y mettre de secretName ni de certResolver.
  tls: {}

# -----------------------------------------------------------------------------
#  Bouncers CrowdSec — plugin Traefik (maxlerebourg/crowdsec-bouncer-traefik-plugin)
# -----------------------------------------------------------------------------
# OPTIONNELS, désactivés par défaut. Deux bouncers indépendants, activables
# séparément, matérialisés chacun par un Middleware Traefik :
#
#   • ban      : REJET pur des décisions « ban » (statusCode + page ban.html).
#   • captcha  : les décisions « captcha » suspendent la requête le temps d'un
#                contrôle (page captcha.html + widget) ; les « ban » restent
#                rejetés par la même instance.
#
# RIEN NE TOURNE ICI : le bouncer est du code exécuté DANS le processus
# Traefik. Ce chart pose les objets que le plugin consomme (Middlewares,
# ConfigMap de pages, Secret de clés), génère les clés d'API au rendu, et les
# enregistre auprès de la LAPI par un job posé DANS LE NAMESPACE CROWDSEC
# (c'est là que vivent les creds DB et l'accès à PgBouncer).
#
# 🛑 DEUX BLOCS À POSER SOI-MÊME dans la section `traefik:` — le subchart rend
#    ces listes avec `toYaml` SANS `tpl`, rien ne peut les alimenter d'ici,
#    et templates/bouncer/guard.yaml REFUSE DE RENDRE tant qu'ils manquent :
#
#      traefik:
#        experimental:
#          # 🛑 requis (garde) : un plugin qui échoue au démarrage ne doit pas
#          # produire un pod Ready sans bouncer — avec le rollout en surge,
#          # l'ancien pod continue de servir, l'échec est bruyant.
#          abortOnPluginFailure: true
#          plugins:
#            bouncer:               # ← = pluginAlias ci-dessous
#              moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
#              version: vX.Y.Z      # épingler une version relevée
#        deployment:
#          additionalVolumes:
#            - name: crowdsec-bouncer-pages
#              configMap: { name: crowdsec-bouncer-pages }
#            - name: crowdsec-bouncer-keys
#              secret: { secretName: crowdsec-bouncer-keys }
#        additionalVolumeMounts:
#          - { name: crowdsec-bouncer-pages, mountPath: /crowdsec/pages, readOnly: true }
#          - { name: crowdsec-bouncer-keys,  mountPath: /crowdsec/keys,  readOnly: true }
#
#    🛑 Un plugin Traefik est TÉLÉCHARGÉ ET COMPILÉ AU DÉMARRAGE de Traefik
#       (plugins.traefik.io puis GitHub) : une dépendance de démarrage de
#       l'entrée publique DE PLUS, qui s'ajoute à celles des initContainers
#       Coraza. À assumer avant d'allumer.
#
# ⚠️ Côté stack CrowdSec (crowdsec-all-in-one) : la NetworkPolicy de son
#    namespace doit laisser les pods Traefik joindre la LAPI (port 8080) —
#    cf. networkPolicy.extraIngress là-bas. La remédiation « captcha » est
#    décidée par SES profils (profiles.yaml) ; ce chart dit seulement comment
#    l'appliquer.
bouncer:
  # ---------------------------------------------------------------------------
  # crowdsec — l'adhérence à la stack CrowdSec, TOUTE ici
  # ---------------------------------------------------------------------------
  crowdsec:
    # 🛑 SANS DÉFAUT, REQUIS dès qu'un bouncer est activé (garde + schéma) :
    # le namespace où tourne crowdsec-all-in-one. Le chart y pose la copie du
    # Secret de clés et le job d'enregistrement.
    namespace: ""

    # 🛑 SANS DÉFAUT, REQUIS : la LAPI vue depuis le pod Traefik, hôte ET port
    # dans la même chaîne (le plugin n'a pas de champ port). Avec
    # crowdsec-all-in-one : <release>-service.<namespace>.svc.cluster.local:8080
    lapiHost: ""
    lapiScheme: http

    # Accès DB du job d'enregistrement — défauts alignés sur crowdsec-all-in-one
    # (Secret `crowdsec-secrets`, clés crowdsecUsername/crowdsecPassword ;
    # service `crowdsec-pgbouncer`). À surcharger si la stack dévie.
    dbSecretName: crowdsec-secrets
    dbHost: crowdsec-pgbouncer
    dbName: crowdsec

  # Hook PostSync (vague 3), posé dans crowdsec.namespace, qui INSERT les
  # bouncers activés dans la table `bouncers` du LAPI (hash sha512 de la clé —
  # équivalent cscli bouncers add). Idempotent (ON CONFLICT UPDATE).
  # Désactiver pour enregistrer soi-même (cscli bouncers add + reporter les
  # clés dans le Secret).
  registerJob:
    enabled: true
    image:
      repository: postgres
      tag: "18-alpine"
      pullPolicy: IfNotPresent

  # Suffixer le nom des Middlewares de l'empreinte des pages (8 hex). Le plugin
  # ne relit une page qu'à la CRÉATION de l'instance du middleware : avec ce
  # suffixe, changer une page recrée l'objet et force la relecture (sans lui :
  # redémarrer les pods Traefik). Contrepartie : le nom change — ne référencer
  # alors le middleware que via attach ci-dessous, jamais en dur ailleurs.
  hashSuffix: false

  # `stream` : copie locale des décisions rafraîchie toutes les 60 s, au lieu
  # d'interroger la LAPI à chaque requête. Recommandé dès qu'il y a du trafic.
  crowdsecMode: stream

  # Comportement quand la LAPI ne répond plus. Défaut plugin `0` : au premier
  # rafraîchissement en échec, le flux est marqué malade et TOUT est refusé
  # (403). `-1` = mode permissif : la dernière copie locale continue de
  # s'appliquer, les IP inconnues passent — on perd les NOUVEAUX bans le temps
  # de la panne, on ne coupe pas le public.
  updateMaxFailure: "0"

  # Verbosité du plugin dans les journaux Traefik. DEBUG dit pourquoi une IP
  # est jugée comme elle l'est — utile les premiers jours, bavard ensuite.
  logLevel: INFO

  # ---------------------------------------------------------------------------
  # branding — charte graphique des pages servies (ban + captcha)
  # ---------------------------------------------------------------------------
  # Les pages embarquées sont neutres ; ces quelques valeurs suffisent à les
  # habiller — même esprit que coraza.errorPage.html pour la 403 du WAF. Pour
  # un contrôle total : ban.overrideHtml / captcha.overrideHtml (HTML complet,
  # avec les marqueurs %%...%% et les doubles accolades du plugin si besoin).
  branding:
    # Nom affiché (préfixe du <title>). Vide → titre générique.
    siteName: ""
    # Logo affiché en tête de page : URL publique ou data-URI (recommandé — la
    # page reste alors sans aucune dépendance réseau). Vide → pas de logo.
    logo: ""
    # Couleur d'accent (séparateur, icône, bordures du widget).
    primaryColor: "#003da5"
    # Couleur de fond de la page.
    backgroundColor: "#f0f4f8"
    # À qui signaler un blocage jugé erroné (texte inséré dans la page).
    supportContact: "l'administrateur du site"
    # Langue des pages embarquées (attribut lang + locale de l'horodatage).
    lang: fr

  # ---------------------------------------------------------------------------
  # pages — la ConfigMap ban.html / captcha.html
  # ---------------------------------------------------------------------------
  pages:
    # ⚠️ Nom FIXE, non préfixé par le release : référencé *littéralement* dans
    #    `traefik.deployment.additionalVolumes` (même contrainte que
    #    coraza.configMapName). La garde vérifie la correspondance.
    configMapName: crowdsec-bouncer-pages
    # Où Traefik la monte. Doit correspondre au additionalVolumeMounts —
    # vérifié par la garde.
    mountPath: /crowdsec/pages
    # Job ArgoCD (hook Sync, vague 1) qui dort entre la ConfigMap (vague 0) et
    # les Middlewares (vague 2), le temps que le kubelet pousse la nouvelle
    # page dans les pods Traefik (~60 s de période de sync). Utile uniquement
    # avec ArgoCD ET hashSuffix: true. Coût : +propagationDelaySeconds à
    # CHAQUE synchronisation.
    waitJob:
      enabled: false
      propagationDelaySeconds: 90
      image: busybox:1.37

  # ---------------------------------------------------------------------------
  # secrets — les clés lues par le plugin (fichiers montés, jamais en clair)
  # ---------------------------------------------------------------------------
  # Le chart génère une clé d'API LAPI PAR bouncer (à la 1ère install, puis
  # préservées) dans ce Secret, et en pose une copie (clés d'API seulement)
  # dans crowdsec.namespace pour le job d'enregistrement. Chaque paramètre
  # sensible du plugin a une variante `…File` : les Middlewares ne contiennent
  # que des CHEMINS, jamais les valeurs.
  secrets:
    # ⚠️ Nom FIXE, référencé *littéralement* dans
    #    `traefik.deployment.additionalVolumes`. La garde vérifie.
    name: crowdsec-bouncer-keys
    # Où Traefik le monte. Doit correspondre au additionalVolumeMounts —
    # vérifié par la garde.
    mountPath: /crowdsec/keys

  # ---------------------------------------------------------------------------
  # forwardedHeaders — faire confiance à un en-tête d'IP cliente custom
  # ---------------------------------------------------------------------------
  # Permet à des sources listées (et elles seules) d'annoncer l'IP cliente dans
  # un en-tête à vous — pas X-Forwarded-For, que Traefik purge à l'entrée pour
  # les sources non déclarées dans SA config statique. Cas d'usage typique :
  # une sonde interne qui pose un ban de test (IP 192.0.2.x, TEST-NET-1) et
  # vérifie le 403 de bout en bout. ⚠️ Revers : un pod d'une IP listée peut
  # usurper une IP cliente auprès du bouncer. Vide → désactivé.
  forwardedHeaders:
    trustedIPs: []
    # ex: ["10.20.0.41/32"]
    headerName: ""
    # ex: X-Probe-Client-Ip

  # ---------------------------------------------------------------------------
  # ban — bouncer de REJET des décisions « ban »
  # ---------------------------------------------------------------------------
  ban:
    # 🛑 L'INTERRUPTEUR. À false, aucun objet de ce bouncer n'est rendu.
    enabled: false
    # Nom enregistré côté LAPI (table `bouncers`). Unique par bouncer.
    bouncerName: crowdsec-traefik-ban
    # Nom du Middleware (suffixé de l'empreinte des pages si hashSuffix).
    middlewareName: crowdsec-traefik-ban
    # 🛑 DOIT ÊTRE L'ALIAS DU PLUGIN dans traefik.experimental.plugins.<alias>.
    # La garde vérifie que la déclaration existe.
    pluginAlias: bouncer
    # Statut HTTP servi avec ban.html sur une décision « ban ».
    statusCode: "403"
    # HTML complet de la page de ban, en remplacement de la page embarquée.
    overrideHtml: ""

  # ---------------------------------------------------------------------------
  # captcha — bouncer de VÉRIFICATION des décisions « captcha »
  # ---------------------------------------------------------------------------
  captcha:
    # 🛑 L'INTERRUPTEUR. À false, aucun objet de ce bouncer n'est rendu.
    enabled: false
    bouncerName: crowdsec-traefik-captcha
    middlewareName: crowdsec-traefik-captcha
    pluginAlias: bouncer

    # Fournisseur : hcaptcha | recaptcha | turnstile | custom.
    # `custom` (défaut) est pensé pour Cap (https://capjs.js.org) auto-hébergé :
    # preuve de travail, sans énigme visuelle, sans traceur, sans tiers.
    # 🛑 Avec un fournisseur auto-hébergé, son hôte DOIT être routé HORS du
    #    middleware captcha (sinon un visiteur en remédiation ne peut jamais
    #    charger le widget) — cf. attach.bypassHosts.
    provider: custom

    # provider=custom : REQUIS (garde) — les deux URL du contrat.
    # URL PUBLIQUE du script du widget (chargée par le NAVIGATEUR du visiteur).
    # ex: https://captcha.example.com/assets/widget.js
    jsURL: ""
    # URL de validation du jeton, appelée par TRAEFIK (serveur à serveur —
    # préférer une URL interne au cluster). Avec Cap : nommer la clé de site
    # dans le chemin fait refuser un jeton émis pour un autre site.
    # ex: http://cap.captcha.svc.cluster.local:3000/<siteKey>/siteverify
    validateURL: ""
    # Champ du formulaire qui porte le jeton (imposé par le widget Cap).
    responseField: cap-token
    # Passé au gabarit comme .FrontendKey — exigé par le plugin même si la
    # page embarquée ne s'en sert pas.
    frontendKey: cap-widget

    # Durée pendant laquelle un captcha résolu vaut laissez-passer pour l'IP.
    # Trop court : contrôle rejoué à chaque navigation ; trop long : une IP
    # partagée reste ouverte après le départ de l'humain qui l'a résolu.
    gracePeriodSeconds: 1800

    # Paramètres de la page captcha embarquée (provider=custom / Cap).
    widget:
      # REQUIS avec la page embarquée (garde) : base du point d'API du widget
      # (le navigateur y joint /<siteKey>/). ex: https://captcha.example.com
      apiBaseURL: ""
      # URL du WebAssembly du widget (window.CAP_CUSTOM_WASM_URL).
      # ex: https://captcha.example.com/assets/cap_wasm_bg.wasm
      wasmURL: ""

    # Clés publique et secrète du site captcha — REQUIS (garde), au choix :
    #   1) inline (siteKey/secretKey) → fusionnées dans le Secret
    #      secrets.name, monté une seule fois. ⚠️ secret en clair dans les
    #      values — à réserver aux values chiffrées (SOPS…).
    #   2) existingSecret → Secret pré-existant DANS LE NAMESPACE DU RELEASE,
    #      à monter soi-même (mountPath ci-dessous, vide → secrets.mountPath).
    keys:
      siteKey: ""
      secretKey: ""
      existingSecret: ""
      mountPath: ""
      siteKeyFile: captcha-site-key
      secretKeyFile: captcha-secret-key

    # HTML complet de la page captcha, en remplacement de la page embarquée.
    overrideHtml: ""

  # ---------------------------------------------------------------------------
  # attach — accrochage au-dessus du catch-all du WAF
  # ---------------------------------------------------------------------------
  # Pose un routeur `catchAll.match` à catchAll.priority+1 vers le service
  # Coraza, portant le middleware choisi — le sandwich WAF est conservé — et,
  # si bypassHosts est renseigné, un routeur SANS bouncer à +2 (🛑 toujours y
  # lister un serveur de captcha auto-hébergé). Entrypoints, service, priorité
  # et TLS sont repris de catchAll/coraza : rien à recopier. Si le middleware
  # ne se résout pas, seul ce routeur tombe : le waf-catchall reprend le
  # trafic, sans bouncer.
  # Alternative : laisser enabled: false et référencer le middleware depuis
  # vos Ingress/IngressRoute applicatifs.
  attach:
    enabled: false
    name: crowdsec-bouncer
    # Middleware accroché au catch-all : `captcha` (qui traite AUSSI les bans)
    # ou `ban`.
    middleware: captcha
    # Hôtes routés SANS bouncer (serveur de captcha, et rien d'autre : un hôte
    # listé ici n'est plus protégé par CrowdSec — Coraza, lui, l'inspecte
    # toujours).
    bypassHosts: []

# -----------------------------------------------------------------------------
#  rollout — garde-fous des mises à jour (templates/rollout-guard.yaml)
# -----------------------------------------------------------------------------
# Le rendu REFUSE toute combinaison qui rendrait une mise à jour de
# configuration non transparente (nœud sans ingress pendant l'init/compilation) :
# stratégie sans surge, maxUnavailable > 0, hostPort sur un entrypoint.
# Cf. le bloc `traefik.updateStrategy` plus haut pour le raisonnement.
rollout:
  # Passer à true pour ASSUMER une stratégie disruptive (par ex. déploiement
  # en hostPort, où le surge est impossible : le rollout coupera alors chaque
  # nœud le temps de l'init). Les gardes correspondantes sont désactivées.
  allowDisruptiveUpdates: false

# -----------------------------------------------------------------------------
#  Compatibilité de nommage avec un install standalone du chart Traefik
#
#  Permet de déployer ce chart À LA PLACE d'un release Traefik existant : les
#  objets du subchart reprennent les noms et les labels qu'ils auraient eus en
#  standalone, donc l'upgrade les adopte au lieu d'en créer de nouveaux.
# -----------------------------------------------------------------------------
standaloneNaming:
  # Nom du release Traefik standalone auquel s'aligner. Sert uniquement de
  # référence à la vérification faite par templates/naming-guard.yaml, qui
  # compare les noms et labels rendus à ceux qu'aurait produits
  # `helm install <expectedRelease> traefik/traefik` dans le même namespace.
  #
  # Mettre à "" pour un déploiement neuf, sans Traefik existant à reprendre :
  # la vérification est désactivée.
  #
  # Attention, "" ne « libère » pas le nommage : `traefik.fullnameOverride` reste
  # à `traefik` plus bas, donc les objets s'appellent toujours `traefik`. Pour
  # revenir à un nommage dérivé du nom du release, vider aussi
  # `traefik.fullnameOverride`.
  expectedRelease: traefik

# -----------------------------------------------------------------------------
#  Subchart Traefik — overrides
#  Clés alignées sur le chart 41.0.2 (cf. Chart.yaml). Deux d'entre elles ont
#  une autre forme dans la majeure 39, celle de la release 0.6.1 (K8s 1.23) :
#      `service.spec.type`             ← `service.type` en 39.x
#      `service.spec.externalTrafficPolicy` ← `service.externalTrafficPolicy`
#      `log`/`accessLog`               ← `logs.general`/`logs.access`
#  Deux autres avaient bougé plus tôt en amont, forme identique dans les deux :
#      `ports.web.http.redirections`, `ports.websecure.http.tls`
# -----------------------------------------------------------------------------
traefik:
  enabled: true

  # --- Nommage ---------------------------------------------------------------
  # Fige les noms d'objets sur ceux d'un install standalone nommé `traefik`,
  # indépendamment du nom du release de CE chart. Sans ça, un release nommé
  # « traefik-coraza » produirait un DaemonSet « traefik-coraza », un
  # ServiceAccount « traefik-coraza », etc., et l'upgrade d'un Traefik existant
  # créerait des objets neufs au lieu d'adopter les siens.
  #
  # Conséquence assumée : deux releases de ce chart ne peuvent pas coexister
  # dans un même namespace. C'est cohérent — il n'y a qu'un ingress controller.
  fullnameOverride: traefik

  # `app.kubernetes.io/instance`, qui fait partie de spec.selector.matchLabels,
  # donc IMMUABLE. Par défaut le subchart calcule `<release>-<namespace>`.
  #
  # À renseigner UNIQUEMENT si le release de ce chart ne porte pas le même nom
  # que le release Traefik remplacé. templates/naming-guard.yaml détecte le cas
  # au rendu et affiche la valeur exacte à mettre ici, plutôt que de laisser
  # l'upgrade échouer côté API à mi-parcours.
  instanceLabelOverride: ""

  deployment:
    # Contrainte dure.
    kind: DaemonSet

    # Un pod remplaçant qui devient Ready puis meurt (plugin qui se charge mal,
    # OOM au chargement du CRS…) ne doit pas avoir déjà fait tuer l'ancien :
    # le contrôleur ne compte le pod « available » qu'après ce délai de bonne
    # santé, et le rollout — donc la suppression de l'ancien pod — attend.
    # 30 s couvrent le provisioning complet (CRS chargé, plugin compilé par
    # Yaegi, premières sondes passées).
    minReadySeconds: 30

    additionalVolumes:
      # Template Caddyfile patché, produit par l'initContainer.
      - name: caddy-template
        emptyDir: {}
      # Binaire Caddy recompilé avec coraza-caddy/v2 et le patch de flush,
      # produit par l'initContainer `caddy-plugin-build` et monté par-dessus
      # /usr/bin/caddy dans le sidecar.
      - name: caddy-bin
        emptyDir: {}
      # Nos directives Sec*.
      - name: coraza-config
        configMap:
          # ⚠️ doit correspondre à `coraza.configMapName` (non templatable ici).
          name: coraza-config
      # Page servie sur refus du WAF. ConfigMap séparée de `coraza-config` à
      # dessein : la sonde de redémarrage hache `config.d/*.conf`, une page
      # rangée là-bas ferait redémarrer le WAF à chaque retouche de texte.
      - name: coraza-errorpages
        configMap:
          # ⚠️ doit correspondre à `coraza.errorPage.configMapName`.
          name: coraza-errorpages

    # --- patch du template Caddyfile -----------------------------------------
    # Régénéré depuis le template vierge de l'image à chaque démarrage, donc
    # idempotent par construction — aucune garde nécessaire.
    # awk plutôt que sed : `a\` multiligne diffère entre busybox et GNU.
    #
    # Quatre injections, quatre rôles distincts :
    #  1. bloc global `servers { trusted_proxies static private_ranges }` —
    #     c'est ce qui fait résoudre {client_ip} / REMOTE_ADDR. Sans lui,
    #     client_ip vaut l'IP du pod Traefik.
    #  2. `header_up X-Forwarded-For {client_ip}` dans reverse_proxy — SANS `+`,
    #     donc REMPLACE. Avec `+` (comportement par défaut de reverse_proxy,
    #     RFC 7239), Traefik recevrait "A.B.C.D, 10.85.75.73" dans ClientHost et
    #     `ipStrategy.depth: 1` cesserait d'être déterministe.
    #  3. `read_timeout 0` à la place de `read_timeout ${PROXY_TIMEOUT}` (60 s
    #     dans l'image). Caddy réarme ce délai avant CHAQUE lecture amont : à
    #     60 s, tout flux plus silencieux que ça est coupé (« i/o timeout »),
    #     ce qui suffit à tuer le SSE d'Argo CD sur un cluster calme. Mesuré sur
    #     banc : coupure à 60,0 s pile avec le template amont, flux intact
    #     au-delà de 70 s de silence avec `0`.
    #     ⚠️ Contrepartie assumée : plus de garde-fou si l'amont se fige en
    #        cours de réponse. `dial_timeout` et `write_timeout` gardent leurs
    #        60 s, un backend injoignable échoue donc toujours vite. Pour
    #        revenir au comportement amont : retirer la stanza `read_timeout`
    #        de l'awk ci-dessous ET son `grep -q` de garde.
    #  4. bloc `handle_errors 403` servant /opt/coraza/errorpages/403.html —
    #     la page montrée à l'humain que le WAF refuse à tort (cf.
    #     `coraza.errorPage`). Le filtre `403` est ce qui la tient à l'écart
    #     des 502 : backend injoignable ⇒ page Caddy par défaut, pas un
    #     message parlant de sécurité.
    #     ⚠️ L'ancre est le `log {` du bloc de site, PAS celui du bloc global
    #        (qui porte `level ${LOGLEVEL}`). D'où le drapeau `inproxy`, levé
    #        sur `reverse_proxy` : le bloc global vient AVANT, il ne peut donc
    #        pas matcher. Insérer plus haut placerait `handle_errors` dans le
    #        bloc global, où la directive n'existe pas — Caddy refuserait.
    #     `templates` est là pour la seule chose que la page ne peut pas savoir
    #     d'elle-même : l'IP du client. `{{.ClientIP}}` est résolu par le même
    #     `trusted_proxies` / `client_ip_headers` que ci-dessus, donc il donne
    #     l'IP que voit Coraza — celle qui figure dans la ligne d'audit, pas
    #     celle de Traefik. Vérifié sur banc : sans `X-Forwarded-For` il rend
    #     l'IP du pair, avec, celle du client.
    #     ⚠️ La page devient un template Go : un `{{` littéral qui n'est pas un
    #        de nos placeholders la fait échouer au rendu, et Caddy répond 500 —
    #        un refus du WAF deviendrait une panne. templates/configmap-errorpage.yaml
    #        refuse de rendre dans ce cas plutôt que de le laisser passer.
    #
    # Pas de runAsUser ici : l'initContainer hérite du podSecurityContext.
    # Forcer runAsUser: 0 le ferait refuser à l'admission (runAsNonRoot: true).
    initContainers:
      # Nom volontairement stable : les procédures de diagnostic le référencent
      # (kubectl logs … -c caddy-template-patch).
      - name: caddy-template-patch
        # ⚠️ MÊME TAG que l'autre conteneur (cf. en-tête du fichier).
        image: ghcr.io/coreruleset/coraza-crs:4.28.0-caddy-alpine-202608260808
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            awk '
              /^[[:space:]]*order coraza_waf first$/ {
                print
                print "  servers {"
                print "    trusted_proxies static private_ranges"
                print "    client_ip_headers X-Forwarded-For"
                print "  }"
                next
              }
              /^[[:space:]]*reverse_proxy / {
                inproxy = 1
                print
                print "    header_up X-Forwarded-For {client_ip}"
                next
              }
              /^[[:space:]]*read_timeout / {
                sub(/read_timeout .*/, "read_timeout 0")
                print
                next
              }
              inproxy && /^[[:space:]]*log[[:space:]]*\{/ {
                inproxy = 0
                print "  handle_errors 403 {"
                print "    root * /opt/coraza/errorpages"
                print "    rewrite * /403.html"
                print "    templates"
                print "    file_server"
                print "  }"
                print ""
                print
                next
              }
              { print }
            ' /templates/Caddyfile > /work/Caddyfile
            # Garde de sortie : si l'amont réorganise le template et que les
            # ancres ne matchent plus, le pod ne démarre pas. Échec bruyant
            # plutôt que WAF silencieusement mal configuré.
            grep -q 'trusted_proxies static private_ranges' /work/Caddyfile
            grep -q 'header_up X-Forwarded-For'             /work/Caddyfile
            grep -q 'read_timeout 0'                        /work/Caddyfile
            grep -q 'handle_errors 403'                     /work/Caddyfile
            grep -q 'templates'                             /work/Caddyfile
            echo "--- Caddyfile patché ---"; cat /work/Caddyfile
        volumeMounts:
          - { name: caddy-template, mountPath: /work }
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile: { type: RuntimeDefault }
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 10m, memory: 32Mi }

    # --- compilation du binaire Caddy avec coraza-caddy/v2 -------------------
    # Placé APRÈS le patch du template : celui-ci échoue en deux secondes si les
    # ancres amont ont bougé, autant le savoir avant d'attendre une compilation.
    #
    # Pourquoi compiler ici plutôt que publier une image :
    #  - il ne reste qu'un patch d'une ligne à porter, déjà proposé en amont
    #    (corazawaf/coraza-caddy#344) ; monter une chaîne de build et un
    #    registre pour une image jetable coûterait plus cher ;
    #  - l'API de build officielle de Caddy (caddyserver.com/api/download) rend
    #    exactement ce binaire en quelques secondes, mais elle répond
    #    « Contact the Caddy team » aux agents automatisés. L'automatiser
    #    reviendrait à contourner une restriction délibérée : écartée.
    #
    # Deux épinglages, deux rôles :
    #  - `v2.6.0` fixe la version de coraza-caddy — délibérément plus récente
    #    que le `v2.5.0` de l'image, cf. § « bascule de protocole » ;
    #  - le tag de l'image builder fixe la version de Caddy produite (2.11.4,
    #    imposée par le go.mod de coraza-caddy v2.6.0).
    #
    # Ce que cet initContainer apporte encore, depuis que
    # coreruleset/coraza-crs-docker#78 est fusionnée et que l'image officielle
    # embarque coraza-caddy/v2 :
    #  - la version du module. L'image épingle v2.5.0, qui CASSE les WebSocket ;
    #    v2.6.0 les répare (corazawaf/coraza-caddy#262). Rien à patcher pour ça,
    #    juste une version plus récente que celle de `docker-bake.hcl` amont.
    #  - UN patch, le flush : ni v2.5.0 ni v2.6.0 ne propagent de flush au
    #    client, donc toute réponse en flux est retenue jusqu'à la fin de la
    #    réponse amont (SSE mort, cf. `coraza` § « réponses en flux »).
    #    corazawaf/coraza-caddy#344 porte le même correctif en amont ; à sa
    #    publication, cet initContainer n'aura plus de raison d'être.
    # Le patch du statut 101 écrit ici a été JETÉ : v2.6.0 le fait mieux
    # (hijackerTracker).
    #
    # ⚠️ NE PAS monter au-delà de Caddy 2.11.4 sans rejouer le test WebSocket.
    #    caddyserver/caddy#7913 (attendu en 2.11.5) enveloppe tout
    #    ResponseWriter dans un `IdleTimeoutWriter` qui n'expose plus que
    #    `Unwrap()` : l'assertion `i.w.(http.Hijacker)` de coraza-caddy échouera
    #    à son tour et les WebSocket recasseront. C'est l'autre moitié de
    #    corazawaf/coraza-caddy#344, qui va chercher Hijacker le long de la
    #    chaîne d'Unwrap. Tant qu'elle n'est pas publiée, le couple
    #    (caddy 2.11.4, coraza-caddy v2.6.0 + patch de flush) est le seul
    #    vérifié.
      - name: caddy-plugin-build
        # Image OFFICIELLE Caddy, variante builder : Go + xcaddy. Ce n'est pas
        # l'image du WAF, son tag suit la version de Caddy et non celle du CRS.
        # ⚠️ 2.11.4 et non 2.11.3 (la version de l'image du WAF) : coraza-caddy
        #    v2.6.0 EXIGE caddy >= v2.11.4 dans son go.mod, et MVS l'emporte sur
        #    le pin de xcaddy. Le binaire produit serait 2.11.4 quel que soit ce
        #    tag ; autant que le tag dise la vérité. Le binaire remplaçant celui
        #    de l'image, c'est lui qui compte à l'exécution.
        image: caddy:2.11.4-builder
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            # Le podSecurityContext impose un UID sans répertoire personnel :
            # sans ces variables, Go tente d'écrire dans /root et échoue.
            # Les caches restent dans la couche du conteneur et disparaissent
            # avec l'initContainer ; seul le binaire survit dans l'emptyDir.
            export HOME=/tmp/build GOPATH=/tmp/build/go GOCACHE=/tmp/build/cache
            mkdir -p "$GOPATH" "$GOCACHE" /tmp/build/src
            # INDISPENSABLE : l'image builder pose XCADDY_SETCAP=1, et xcaddy
            # tente alors un `setcap` sur le binaire produit. Sous
            # runAsNonRoot + capabilities drop ALL, l'appel échoue, xcaddy sort
            # en erreur, `set -e` tue l'initContainer et le pod ne démarre
            # JAMAIS — alors que le binaire, lui, était bien compilé. La file
            # capability est inutile ici : Caddy écoute sur 8090.
            export XCADDY_SETCAP=0
            # Source du module, épinglée. Un tag disparu casse le build.
            # v2.6.0, PAS le v2.5.0 de l'image : c'est cette version qui répare
            # les WebSocket (hijackerTracker + flush du 101).
            git clone --quiet --depth 1 --branch v2.6.0 \
                https://github.com/corazawaf/coraza-caddy /tmp/build/src/coraza-caddy
            cd /tmp/build/src/coraza-caddy
            # Un seul patch : le flush. `rwInterceptor.Flush()` teste
            # `i.w.(http.Flusher)`, que Caddy n'implémente plus depuis 2.6.3
            # (le recorder expose FlushError(), les wrappers Unwrap()) :
            # l'assertion échoue toujours et aucun flush n'atteint le client.
            # http.ResponseController reconnaît les trois formes.
            # ⚠️ Le nom de la variable a changé entre v2.5.0 (`flusher`) et
            #    v2.6.0 (`fl`), et l'indentation est passée à trois niveaux :
            #    l'ancre suit v2.6.0. La garde de sortie plus bas transforme
            #    tout écart en échec de build.
            awk '
              /if fl, ok := i\.w\.\(http\.Flusher\); ok \{/ {
                print "\t\t\t//nolint:errcheck"
                print "\t\t\thttp.NewResponseController(i.w).Flush()"
                skip = 2
                next
              }
              skip > 0 { skip--; next }
              { print }
            ' interceptor.go > interceptor.go.patched
            mv interceptor.go.patched interceptor.go
            # Gardes de sortie : le motif a changé en amont → build cassé plutôt
            # que binaire silencieusement non corrigé.
            grep -q 'NewResponseController(i.w).Flush()' interceptor.go
            ! grep -q 'i.w.(http.Flusher)' interceptor.go
            # Le correctif WebSocket doit venir de la version clonée, pas de
            # nous : si ce marqueur disparaît, c'est que le tag ne le contient
            # pas et les WebSocket casseraient en silence.
            grep -q 'hijackerTracker' interceptor.go
            cd /
            xcaddy build --with github.com/corazawaf/coraza-caddy/v2@v2.6.0=/tmp/build/src/coraza-caddy \
                         --output /work/caddy
            # Garde de sortie : sans le suffixe /v2, Go résoudrait le module v1
            # SANS erreur, et on repartirait pour une phase 4 morte. C'est le
            # piège dans lequel l'image amont était tombée jusqu'au 2026-08-26.
            /work/caddy build-info | grep -q 'coraza-caddy/v2' \
              || { echo "!! binaire construit sans coraza-caddy/v2" >&2; exit 1; }
            # Et le patch doit être dans le binaire : avec un remplacement
            # local build-info affiche une ligne `=> /tmp/build/src/coraza-caddy`.
            /work/caddy build-info | grep -q '=>.*coraza-caddy' \
              || { echo "!! binaire construit sans le patch de flush" >&2; exit 1; }
            /work/caddy build-info | grep -iE 'coraza|=>'
            /work/caddy version
        volumeMounts:
          - { name: caddy-bin, mountPath: /work }
        # Deux accès réseau nécessaires au démarrage : le proxy de modules Go
        # ET github.com, pour le clone du module à patcher. Sans l'un des deux,
        # l'initContainer échoue et le pod ne démarre pas — donc plus d'ingress
        # sur ce nœud. Échec bruyant, jamais de WAF muet.
        # GOPROXY : à renseigner si les nœuds ne joignent pas proxy.golang.org.
        # Un miroir git interne se déclare en changeant l'URL du clone ci-dessus.
        # env:
        #   - { name: GOPROXY, value: "https://proxy.interne/" }
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile: { type: RuntimeDefault }
          capabilities: { drop: ["ALL"] }
        resources:
          # Compilation Go : le pod démarre plus lentement s'il est bridé ici.
          requests: { cpu: "1", memory: 1Gi }
          limits: { memory: 2Gi }

    # --- sidecar WAF ---------------------------------------------------------
    additionalContainers:
      # Nom volontairement stable : les procédures de diagnostic le référencent
      # (kubectl logs … -c coraza).
      - name: coraza
        # ⚠️ MÊME TAG que l'autre conteneur (cf. en-tête du fichier).
        image: ghcr.io/coreruleset/coraza-crs:4.28.0-caddy-alpine-202608260808
        imagePullPolicy: IfNotPresent
        ports:
          - name: coraza
            containerPort: 8090
        env:
          # ⚠️ noms exacts à confirmer via `cat /entrypoint.sh` dans l'image.
          - name: BACKEND
            value: "http://127.0.0.1:8880"
          - name: PORT
            value: "8090"
          # Le template fait `log { output file ${ACCESSLOG} }` : un chemin de
          # fichier, pas stdout. Sans ça le log d'accès est introuvable.
          - name: ACCESSLOG
            value: "/dev/stdout"
          # `tag:` est une action de métadonnée : les versions récentes de
          # coraza la refusent dans SecDefaultAction et le sidecar ne démarre
          # pas (« SecDefaultAction must not contain metadata actions »).
          # L'image l'injectait par défaut dans crs-setup.conf ; le commit qui a
          # fusionné coreruleset/coraza-crs-docker#78 l'a retiré, ces deux
          # variables valent donc désormais exactement le défaut de l'image.
          # CONSERVÉES comme filet : elles redeviennent indispensables si l'on
          # repique un tag antérieur au 2026-08-26.
          - { name: CORAZA_DEFAULT_PHASE1_ACTION, value: "phase:1,pass,log" }
          - { name: CORAZA_DEFAULT_PHASE2_ACTION, value: "phase:2,pass,log" }
          # Réglage de la paranoïa : ces variables agissent par `sed` sur
          # crs-setup.conf (script /opt/coraza/activate-rules.sh), PAS via
          # overrides/, qui n'est alimenté par rien dans l'image. Noms relevés
          # sur le Dockerfile amont.
          # - { name: PARANOIA,          value: "1" }
          # - { name: BLOCKING_PARANOIA, value: "1" }
          # - { name: ANOMALY_INBOUND,   value: "5" }
          # - { name: ANOMALY_OUTBOUND,  value: "4" }
        volumeMounts:
          # Binaire recompilé (coraza-caddy v2.6.0 + patch de flush), par-dessus
          # celui de l'image. `subPath` monte le seul fichier, sans masquer
          # /usr/bin.
          # Corollaire : la file capability cap_net_bind_service du binaire de
          # l'image disparaît — sans conséquence, Caddy écoute sur 8090, et
          # NET_BIND_SERVICE plus bas reste nécessaire si l'on retire ce montage.
          - { name: caddy-bin, mountPath: /usr/bin/caddy, subPath: caddy, readOnly: true }
          - name: caddy-template
            mountPath: /templates/Caddyfile
            # subPath : monte le seul fichier, ne masque pas le reste de /templates.
            subPath: Caddyfile
            readOnly: true
          - { name: coraza-config, mountPath: /opt/coraza/config.d, readOnly: true }
          # Montage de RÉPERTOIRE, pas de `subPath` : c'est ce qui fait qu'une
          # retouche de la page se propage sans redémarrer quoi que ce soit
          # (un `subPath` fige le contenu au démarrage du conteneur).
          - { name: coraza-errorpages, mountPath: /opt/coraza/errorpages, readOnly: true }
          # NE JAMAIS monter de volume sur /opt/coraza/config : cela masquerait
          # coraza.conf et crs-setup.conf livrés par l'image.
        # --- prise en compte des changements de la ConfigMap ------------------
        # Coraza ne relit ses `include` qu'au provisioning du module Caddy : sans
        # mécanisme dédié, un `helm upgrade` ne change rien tant que le pod n'est
        # pas recréé. Cette sonde fait redémarrer CE CONTENEUR — pas le pod :
        # Traefik continue de tourner, et le binaire compilé par l'initContainer
        # survit dans son emptyDir, donc aucune recompilation. Coupure du WAF
        # mesurée : ~2 s, fail-closed (502) le temps du redémarrage.
        #
        # Le rechargement à chaud (`caddy reload`) a été essayé et écarté :
        # coraza-caddy v2 garde ses WAF dans un pool dont la clé ne hache que les
        # CHEMINS d'include, jamais le contenu des fichiers. Le rechargement
        # journalisait « reusing existing WAF instance from pool » et ne relisait
        # pas les règles : il paraissait réussir sans rien changer.
        #
        # Pour repasser en redémarrage MANUEL, supprimer cette sonde. Les
        # changements de configuration n'auront alors d'effet qu'après un
        #   kubectl -n <ns> rollout restart daemonset/traefik
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                rev=/tmp/coraza-config.rev
                # Santé RÉELLE du serveur, d'abord. Sans cette ligne la sonde
                # répondait « sain » quoi qu'il arrive tant que la configuration
                # ne bougeait pas : un Caddy figé qui garde son port ouvert
                # n'était redémarré par personne. La readiness ne rattrape pas le
                # cas — en mode externalName le Service n'a pas d'endpoints, elle
                # ne filtre aucun trafic — donc le nœud servait des 502 sans fin.
                nc -z 127.0.0.1 8090 || {
                  echo "port 8090 muet : le serveur ne répond plus" >&2
                  exit 1
                }
                cur=$(cat /opt/coraza/config.d/*.conf 2>/dev/null | md5sum | cut -d' ' -f1)
                # Référence ancrée sur le PROCESSUS (démarrage de PID 1) et non
                # sur la fraîcheur de /tmp : selon le runtime, la couche
                # inscriptible survit au redémarrage du conteneur, et une
                # référence périmée redemanderait un redémarrage à CHAQUE sonde
                # — précisément le CrashLoopBackOff qu'on cherche à éviter.
                # Reproduit avec la version naïve, corrigé par cet ancrage.
                # (champ 22 = starttime ; le découpage naïf sur l'espace n'est
                # juste que parce que le `comm` de PID 1, « caddy », n'en
                # contient pas.)
                # En régime normal le startupProbe a déjà écrit cette référence
                # au démarrage ; ce bloc ne sert plus que s'il était retiré.
                boot=$(cut -d' ' -f22 /proc/1/stat 2>/dev/null || echo 0)
                sboot=""; srev=""
                [ -f "$rev" ] && read -r sboot srev < "$rev"
                if [ "$sboot" != "$boot" ]; then echo "$boot $cur" > "$rev"; exit 0; fi
                [ "$cur" = "$srev" ] && exit 0
                # La configuration a changé. Ne JAMAIS redémarrer sans l'avoir
                # validée : une règle invalide empêcherait le conteneur de
                # repartir, et le WAF étant fail-closed, le nœud ne servirait
                # plus rien du tout. `caddy validate` provisionne réellement le
                # module — il compile les règles et charge le CRS — sans ouvrir
                # de port : il cohabite avec le serveur en cours.
                # `timeout` borne la validation DANS le script, sous le
                # timeoutSeconds de la sonde. Sans lui, un validate qui traîne
                # sur un nœud sous pression fait expirer la sonde ; kubelet
                # compte alors un échec — donc redémarre, failureThreshold
                # valant 1 — sans que la validation ait rien conclu. C'est
                # exactement l'accident que cette garde existe pour empêcher :
                # redémarrage sur configuration invalide, conteneur qui ne
                # repart pas, CrashLoopBackOff, et un WAF fail-closed qui ne
                # sert plus rien.
                if timeout 12 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/tmp/validate.log 2>&1; then
                  echo "config.d modifiée et valide -> redémarrage du conteneur coraza" >&2
                  exit 1
                fi
                # Invalide OU indécis : dans les deux cas, pas de redémarrage.
                echo "config.d modifiée mais NON VALIDÉE : redémarrage refusé, le WAF continue sur la configuration précédente" >&2
                tail -5 /tmp/validate.log >&2
                exit 0
          periodSeconds: 20
          # `caddy validate` charge tout le CRS : compter large. Doit rester
          # STRICTEMENT supérieur au `timeout 12` du script, pour que ce soit le
          # script qui tranche et non kubelet.
          timeoutSeconds: 15
          # Un échec ne traduit pas une panne mais une décision : ne pas attendre.
          failureThreshold: 1
        readinessProbe:
          # Caddy n'expose pas /healthz : une sonde HTTP partirait vers le backend
          # et remonterait un 404.
          tcpSocket: { port: 8090 }
          periodSeconds: 5
          failureThreshold: 2
        startupProbe:
          # Exec plutôt que tcpSocket, parce que cette sonde a désormais un
          # second rôle : ancrer l'empreinte de la configuration RÉELLEMENT
          # chargée. Caddy n'ouvre son port qu'après avoir provisionné le
          # module, donc son premier succès est le premier instant où l'on peut
          # affirmer « le processus tourne sur ce contenu-là ».
          #
          # Sans cet ancrage, c'était la première livenessProbe qui écrivait la
          # référence, jusqu'à 20 s plus tard : une modification poussée dans
          # cet intervalle — juste après un rollout, quand on pousse justement un
          # correctif — était absorbée définitivement. La référence enregistrait
          # le nouveau contenu, le processus gardait les anciennes règles, et
          # aucune sonde ultérieure ne pouvait plus s'en apercevoir.
          #
          # Kubernetes ne démarre liveness et readiness qu'après le succès du
          # startupProbe, à CHAQUE démarrage de conteneur, redémarrages compris :
          # la référence est donc toujours fraîche quand la liveness prend le
          # relais.
          exec:
            command:
              - /bin/sh
              - -c
              - |
                nc -z 127.0.0.1 8090 || exit 1
                boot=$(cut -d' ' -f22 /proc/1/stat 2>/dev/null || echo 0)
                cur=$(cat /opt/coraza/config.d/*.conf 2>/dev/null | md5sum | cut -d' ' -f1)
                echo "$boot $cur" > /tmp/coraza-config.rev
          periodSeconds: 3
          failureThreshold: 20      # chargement du CRS complet
        resources:
          requests: { cpu: "1", memory: 512Mi }
          # Pas de limit CPU : le WAF est regex-bound, le throttling se paierait
          # directement en p99.
          limits: { memory: 1Gi }
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          # UID/GID propriétaires de /opt/coraza dans l'image. Nécessaire parce
          # que le podSecurityContext du chart Traefik impose 65532, qui n'y a pas
          # les droits : /entrypoint.sh écrit dans /opt/coraza/config au démarrage.
          # Surcharge au niveau conteneur, donc n'affecte pas Traefik lui-même.
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile: { type: RuntimeDefault }
          capabilities:
            drop: ["ALL"]
            # INDISPENSABLE. Le binaire caddy porte la file capability
            # cap_net_bind_service=+ep ; avec drop:[ALL] seul, le kernel refuse
            # l'execve d'un binaire « capability-dumb » → Operation not permitted.
            # Vrai même si Caddy écoute sur 8090.
            add: ["NET_BIND_SERVICE"]

  # --- Rollout : le nœud ne doit JAMAIS perdre son entrée publique ------------
  # Le démarrage d'un pod Traefik de ce chart est LONG et dépendant du réseau :
  # patch du Caddyfile, ~2 min de compilation Caddy (caches vides), chargement
  # du CRS, et — bouncer activé — téléchargement + compilation Yaegi du plugin.
  # Avec la stratégie par défaut d'un DaemonSet (maxUnavailable: 1, pas de
  # surge), CHAQUE mise à jour de configuration laisserait chaque nœud sans
  # ingress pendant toute cette phase d'init.
  #
  # D'où ce réglage, ÉPINGLÉ ici (c'est le défaut du chart 41.0.2, mais un bump
  # amont ne doit pas pouvoir le changer en silence) : le pod remplaçant est
  # créé À CÔTÉ de l'ancien (surge), qui continue de servir jusqu'à ce que le
  # nouveau soit Ready + minReadySeconds. Coupure : zéro.
  #
  # Ce que ça suppose — vérifié au rendu par templates/rollout-guard.yaml :
  #   • kubeVersion >= 1.25 (maxSurge sur DaemonSet GA) — c'est le plancher
  #     déclaré par Chart.yaml, aligné sur celui du subchart Traefik ;
  #   • PAS de hostPort sur les entrypoints (deux pods coexistent sur le nœud
  #     pendant le surge : un hostPort entrerait en conflit). L'exposition
  #     passe par le Service NodePort externalTrafficPolicy: Local, qui ne
  #     route que vers les pods Ready du nœud : la bascule est atomique ;
  #   • PAS de hostNetwork (même conflit, le subchart le refuse déjà).
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # --- Service ---------------------------------------------------------------
  service:
    enabled: true
    # Chart 41.x : le type et le reste du ServiceSpec passent par `spec`.
    # (En 39.x c'étaient des clés directes — cf. la release 0.6.1, compatible
    # K8s 1.23.)
    spec:
      type: NodePort
      # Sans ça : SNAT par kube-proxy → perte de l'IP source.
      # Corollaire : seuls les nœuds portant un pod répondent — cohérent avec
      # le DaemonSet.
      externalTrafficPolicy: Local

  # --- Entrypoints -----------------------------------------------------------
  ports:
    web:
      port: 8000
      exposedPort: 80
      expose: { default: true }
      # nodePort:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true

    websecure:
      port: 8443
      exposedPort: 443
      expose: { default: true }
      # nodePort:
      http3:
        enabled: false
      http:
        tls:
          enabled: true
          # PAS de certResolver ni de domains : cert-manager reste seul maître
          # du TLS, via les blocs `tls` des Ingress applicatifs.
      # PAS de forwardedHeaders.trustedIPs ici, volontairement : Traefik doit
      # ÉCRASER tout X-Forwarded-For entrant. C'est le premier maillon qui rend
      # `ipStrategy.depth: 1` non usurpable en aval.

    # Dashboard / ping — ne traverse pas le WAF.
    traefik:
      port: 8080
      exposedPort: 8080
      expose: { default: false }

    # Metrics — ne traverse pas le WAF.
    metrics:
      port: 9100
      exposedPort: 9100
      expose: { default: false }

  # L'entrypoint `internal` est déclaré ICI et pas dans `ports:` À DESSEIN :
  #  - `ports:` génèrerait un containerPort et une entrée de Service, ce qui
  #    rendrait le WAF contournable depuis le réseau du cluster ;
  #  - la forme longue permet de forcer le bind sur 127.0.0.1.
  # Le catch-all n'est PAS déclaré sur `internal` → pas de boucle.
  additionalArguments:
    - "--entryPoints.internal.address=127.0.0.1:8880"
    # `internal` n'écoute que sur loopback : la seule source possible est le
    # sidecar local, donc faire confiance au XFF entrant y est sans risque.
    # C'est ce qui fait remonter la vraie IP client dans ClientHost.
    - "--entryPoints.internal.forwardedHeaders.insecure=true"

  # --- Providers -------------------------------------------------------------
  providers:
    kubernetesCRD:
      enabled: true
      # Requis par le Service ExternalName d'épinglage local (mode externalName).
      # ⚠️ portée cluster-wide : tout IngressRoute pourra proxifier vers un hôte
      #    arbitraire → restreindre la création d'IngressRoute par RBAC ou policy.
      allowExternalNameServices: true
      # allowCrossNamespace n'est PAS requis : le catch-all et le Service coraza
      # vivent tous deux dans le namespace du release, et le template omet
      # volontairement le champ `namespace` sur la référence de service.
      allowCrossNamespace: false
    kubernetesIngress:
      enabled: true
      # Les Ingress applicatifs ne sont pas modifiés : ils continuent de
      # s'attacher à tous les entrypoints. Sur websecure la priorité du
      # catch-all les court-circuite ; sur internal ils sont seuls.

  # --- Observabilité ---------------------------------------------------------
  # Chart 41.x : `log` et `accessLog` sont deux clés de premier niveau. (En
  # 39.x c'était `logs.general` / `logs.access` — cf. la release 0.6.1.)
  log:
    level: INFO
    format: json

  accessLog:
    # Nécessaire pour vérifier ClientHost, donc la propagation de l'IP client
    # réelle jusqu'à l'entrypoint internal.
    enabled: true
    format: json

  metrics:
    prometheus:
      entryPoint: metrics

  # Ressources du conteneur Traefik lui-même (le sidecar a les siennes).
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits: { memory: 512Mi }

  # Le dashboard passe par l'entrypoint traefik, hors WAF : le laisser fermé.
  ingressRoute:
    dashboard:
      enabled: false

  # Ne pas surcharger `podSecurityContext` à la légère :
  # runAsUser/fsGroup y interagissent avec les emptyDir et l'admission des
  # initContainers.
