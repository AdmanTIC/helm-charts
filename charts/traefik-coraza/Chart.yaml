apiVersion: v2
name: traefik-coraza
description: |
  Traefik (chart officiel, en subchart) + WAF Coraza / OWASP CRS en montage
  « sandwich » : websecure (TLS) → sidecar Coraza → entrypoint interne loopback
  → Ingress applicatifs. cert-manager reste seul maître du TLS.
type: application
# Aligné sur le plancher réel, celui du subchart Traefik 41.x (>=1.25.0-0),
# lui-même cohérent avec les besoins du chart : maxSurge sur DaemonSet est GA
# en 1.25, et c'est ce qui rend le rollout transparent (cf. updateStrategy dans
# values.yaml). Aucune API rendue par ce chart n'exige mieux : v1, apps/v1,
# batch/v1, networking.k8s.io/v1, rbac/v1, traefik.io/v1alpha1.
#
# Ne pas durcir sans raison mesurée. Pour les clusters K8s 1.23, utiliser la
# release 0.6.1, épinglée sur le subchart 39.0.9 — rendu équivalent, arguments
# Traefik identiques.
kubeVersion: ">=1.25.0-0"

# version du chart wrapper
version: 0.7.0
# Version du CRS embarquée dans l'image Coraza (OWASP_CRS/4.28.0). Purement
# documentaire : le tag réellement déployé est écrit dans values.yaml, à un
# emplacement par conteneur, et doit être épinglé à la main.
appVersion: "4.28.0"

keywords:
  - traefik
  - waf
  - coraza
  - owasp
  - crs
  - modsecurity

maintainers:
  - name: AdmanTIC

dependencies:
  # Chart officiel, épinglé en 41.0.2 (Traefik v3.7.5). Pas de range : les clés
  # d'override de values.yaml sont validées contre CETTE version — deux d'entre
  # elles changent de forme entre les majeures 39 et 41 (cf. README).
  # Contrepartie : le chart amont exige kubeVersion >=1.25.0-0 à partir de la
  # majeure 40. Les clusters 1.23 doivent rester sur la release 0.6.1.
  - name: traefik
    version: "41.0.2"
    repository: https://traefik.github.io/charts
    condition: traefik.enabled
