{{- $c := .Values.coraza.config -}}
apiVersion: v1
kind: ConfigMap
metadata:
  # Nom fixe : référencé littéralement dans traefik.deployment.additionalVolumes.
  name: {{ .Values.coraza.configMapName }}
  labels:
    {{- include "traefik-coraza.labels" . | nindent 4 }}
data:
  # Monté sur /opt/coraza/config.d/
  #
  # ORDRE D'INCLUSION, relevé sur le template Caddyfile de l'image :
  #   coraza.conf → config.d/*.conf → crs-setup.conf → … → CRS → … → overrides/
  #
  # Donc :
  #   - SecRuleEngine / SecAuditLog* / SecResponseBody* écrasent bien coraza.conf ✅
  #   - les SecRule … ctl: fonctionnent (ctl: agit à l'exécution, pas au chargement) ✅
  #   - un setvar:tx.blocking_paranoia_level ici serait ÉCRASÉ par crs-setup.conf ❌
  #     → passer par les variables d'environnement (overrides/) ou rules.d
  #   - NE JAMAIS ajouter d'Include du CRS ici : le template le charge déjà
  #     (sinon : « there is another rule with id 900000 »)
  #
  # Toute regex doit être RE2-compatible : pas de lookahead/lookbehind/backreference.
  #
  # NOTE AUX MAINTENEURS : deux pièges de rendu, tous deux déjà rencontrés.
  #
  #  1. `int` est obligatoire sur les tailles. Helm parse les nombres en float64
  #     et rendrait 13107200 en « 1.31072e+07 », que Coraza refuse.
  #  2. Les valeurs On/Off passent OBLIGATOIREMENT par `traefik-coraza.secFlag` :
  #     YAML 1.1 résout `On`/`Off`/`Yes`/`No` non quotés en booléens, et un
  #     `ruleEngine: On` rendrait sinon « SecRuleEngine true ».
  custom.conf: |
    SecRuleEngine {{ include "traefik-coraza.secEnum" (dict "value" $c.ruleEngine "directive" "coraza.config.ruleEngine" "allowed" (list "On" "Off" "DetectionOnly")) }}

    SecRequestBodyAccess {{ include "traefik-coraza.secFlag" $c.requestBodyAccess }}
    SecRequestBodyLimit {{ int $c.requestBodyLimit }}
    SecRequestBodyNoFilesLimit {{ int $c.requestBodyNoFilesLimit }}
    SecRequestBodyLimitAction {{ $c.requestBodyLimitAction }}

    # Le sandwich rend la phase 4 ATTEIGNABLE, mais elle n'est réellement
    # exécutée que si le binaire Caddy embarque coraza-caddy >= v2 : la v1.2.2
    # livrée par l'image amont n'appelle jamais ProcessResponseBody().
    # ⚠️ Le Content-Type d'une RÉPONSE listé ici la fait bufferiser, flux
    #    compris : les réponses grpc-gateway d'Argo CD sont du SSE annoncé en
    #    `application/json`. Ce sont les règles id:1001-1003 ci-dessous qui les
    #    exemptent — et elles n'ont d'effet qu'avec coraza-caddy >= v2 patché.
    # Voir README §§ « Inspection des réponses » et « Réponses en flux ».
    SecResponseBodyAccess {{ include "traefik-coraza.secFlag" $c.responseBodyAccess }}
    SecResponseBodyMimeType {{ $c.responseBodyMimeType }}
    SecResponseBodyLimit {{ int $c.responseBodyLimit }}
    SecResponseBodyLimitAction {{ $c.responseBodyLimitAction }}

    SecAuditEngine {{ include "traefik-coraza.secEnum" (dict "value" $c.audit.engine "directive" "coraza.config.audit.engine" "allowed" (list "On" "Off" "RelevantOnly")) }}
    # RE2 : pas de (?!…). Tous les 5xx + tous les 4xx sauf 404.
    SecAuditLogRelevantStatus "{{ $c.audit.relevantStatus }}"
    SecAuditLogParts {{ $c.audit.parts }}
    SecAuditLog {{ $c.audit.target }}
    SecAuditLogFormat {{ $c.audit.format }}
{{- if contains "I" $c.audit.parts }}
    # ⚠️ La partie I embarque le corps de requête → secrets, tokens et données
    # personnelles poussés dans la stack de logs. À retirer après le rodage, ou :
    # SecAuditLogSanitizeArg password,token,authorization
{{- end }}
{{ if $c.builtinExclusions.internalProbes }}
    # --- sondes kubelet et accès par IP interne ---
    SecRule REQUEST_URI "@beginsWith /healthz" \
      "id:1004,phase:1,pass,nolog,ctl:ruleEngine=Off,ctl:auditEngine=Off"
    # Host numérique interne : neutralise 920350 sans le désactiver pour l'externe
    # (un Host numérique venant d'Internet reste un signal de scan à conserver).
    SecRule REQUEST_HEADERS:Host "@rx ^\d{1,3}(\.\d{1,3}){3}(:\d+)?$" \
      "id:1005,phase:1,pass,nolog,ctl:ruleRemoveById=920350"
{{ end }}
{{- if $c.builtinExclusions.acmeChallenge }}
    # --- ACME http-01 : cert-manager en dépend, ne jamais inspecter ---
    SecRule REQUEST_URI "@beginsWith /.well-known/acme-challenge/" \
      "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"
{{ end }}
{{- if $c.builtinExclusions.streamingProtocols }}
    # --- streaming : l'inspection de corps casse WebSocket / gRPC / SSE ---
    # ⚠️ `ctl:responseBodyAccess=Off` n'est honoré qu'à partir de coraza-caddy
    #    v2 : en v1.2.2 la bufferisation ne dépend que du Content-Type de la
    #    réponse, et ces trois règles ne protègent rien. Et même en v2, il faut
    #    le patch de flush du chart pour que les octets ressortent au fil de
    #    l'eau. Voir values.yaml § « réponses en flux ».
    # ⚠️ id:1001 ne suffit PAS à faire marcher les WebSocket : après le 101 la
    #    connexion est détournée, elle ne passe plus par le chemin de réponse
    #    du module. Ce qui les débloque est coraza-caddy >= v2.6.0, la version
    #    que construit `caddy-plugin-build`. La règle reste utile pour le corps
    #    de la REQUÊTE de handshake. Voir values.yaml § « bascule de protocole ».
    SecRule REQUEST_HEADERS:Upgrade "@streq websocket" \
      "id:1001,phase:1,pass,nolog,ctl:requestBodyAccess=Off,ctl:responseBodyAccess=Off"
    SecRule REQUEST_HEADERS:Content-Type "@beginsWith application/grpc" \
      "id:1002,phase:1,pass,nolog,ctl:requestBodyAccess=Off,ctl:responseBodyAccess=Off"
    SecRule REQUEST_HEADERS:Accept "@contains text/event-stream" \
      "id:1003,phase:1,pass,nolog,ctl:responseBodyAccess=Off"
{{ end }}
{{- if $c.clientIpProbe.enabled }}
    # --- sonde : doit rester MUETTE ---
    # Si elle se déclenche, Coraza ne voit pas l'IP client réelle et toutes les
    # règles IP du CRS ainsi que les audit logs sont sans valeur.
    SecRule REMOTE_ADDR "@ipMatch {{ $c.clientIpProbe.privateRanges }}" \
      "id:1099,phase:1,pass,log,msg:'IP client non resolue: %{REMOTE_ADDR}'"
{{ end }}
{{- with .Values.coraza.extraRules }}
    # ------------------------------------------ règles maison (ID 1000-1999)
{{ . | indent 4 }}
{{- end }}
