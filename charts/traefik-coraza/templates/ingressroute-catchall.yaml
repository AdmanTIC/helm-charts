{{- if .Values.catchAll.enabled }}
{{- if has "internal" .Values.catchAll.entryPoints }}
{{- fail "catchAll.entryPoints ne doit JAMAIS contenir \"internal\" : le catch-all renverrait le trafic vers lui-même (boucle infinie)." }}
{{- end }}
# ---------------------------------------------------------------------------
#  Le catch-all : tout ce qui entre par websecure part dans le WAF.
#
#  Les routers issus des Ingress applicatifs s'attachent eux aussi à websecure
#  (ils s'attachent à TOUS les entrypoints) ; la priorité écrasante ci-dessous
#  les court-circuite là. Sur `internal`, où ce router n'existe pas, ils sont
#  seuls — d'où l'absence de boucle.
#
#  `tls: {}` : pas de secretName. Le certificat est résolu par SNI depuis le
#  magasin par défaut, alimenté par les blocs `tls` des Ingress applicatifs,
#  donc par cert-manager. Validé en cluster (HTTP/2, TLS 1.3, bon certificat).
#  cert-manager reste seul maître du TLS, aucun Ingress n'est à modifier.
# ---------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.catchAll.name }}
  labels:
    {{- include "traefik-coraza.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.catchAll.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ .Values.catchAll.match }}
      {{/* `int` obligatoire : sans lui Helm rend 1000000 en « 1e+06 », que
           l'API rejette (le champ priority est un entier). */}}
      priority: {{ int .Values.catchAll.priority }}
      services:
        # Pas de champ `namespace` : le Service coraza vit dans le namespace du
        # release, comme cet IngressRoute. L'omettre évite d'avoir à activer
        # providers.kubernetesCRD.allowCrossNamespace.
        - name: {{ .Values.coraza.service.name }}
          port: {{ int .Values.coraza.port }}
          scheme: http
          # Le Host d'origine doit arriver intact jusqu'à Coraza (règles CRS sur
          # REQUEST_HEADERS:Host) puis jusqu'à l'entrypoint internal, où c'est
          # lui qui sélectionne l'Ingress applicatif.
          passHostHeader: true
          {{- if eq .Values.coraza.service.mode "clusterIP" }}
          # Indispensable en mode clusterIP : sans nativeLB, Traefik répartit
          # sur les endpoints et internalTrafficPolicy n'est jamais consulté.
          nativeLB: true
          {{- end }}
  tls:
    {{- toYaml .Values.catchAll.tls | nindent 4 }}
{{- end }}
