{{- $bn := .Values.bouncer }}
{{- if eq (include "bouncer.anyEnabled" .) "true" }}
{{- $secretName := $bn.secrets.name }}
{{/*
Clés d'API LAPI des bouncers — générées AU RENDU à la 1ère install puis
préservées (lookup + resource-policy keep + Prune=false, même mécanique que
crowdsec-all-in-one). Une clé PAR bouncer (ban / captcha) : révoquer l'un ne
touche pas l'autre. Les clés captcha fournies inline (captcha.keys.siteKey /
secretKey) sont fusionnées ici : un seul volume à monter dans le pod Traefik.

⚠️ Limite connue (assumée ailleurs dans ces charts) : en `helm template` pur
   sans accès cluster, lookup rend nil et les clés sont re-tirées à chaque
   rendu. ArgoCD rend avec un cache d'objets ; en cas de dérive, le job
   d'enregistrement ré-aligne le hash côté LAPI (ON CONFLICT UPDATE).
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $banKey := "" }}
{{- $captchaKey := "" }}
{{- if $existing }}
  {{- with index $existing.data "ban-api-key" }}{{ $banKey = . | b64dec }}{{ end }}
  {{- with index $existing.data "captcha-api-key" }}{{ $captchaKey = . | b64dec }}{{ end }}
{{- end }}
{{- if not $banKey }}{{ $banKey = randAlphaNum 64 }}{{ end }}
{{- if not $captchaKey }}{{ $captchaKey = randAlphaNum 64 }}{{ end }}
{{- $inlineCaptchaKeys := and $bn.captcha.enabled $bn.captcha.keys.siteKey (not $bn.captcha.keys.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bouncer.labels" . | nindent 4 }}
  annotations:
    # Generated once at first install, then preserved across upgrades / prune.
    "helm.sh/resource-policy": keep
    "argocd.argoproj.io/sync-options": Prune=false
type: Opaque
stringData:
  ban-api-key: "{{ $banKey }}"
  captcha-api-key: "{{ $captchaKey }}"
  {{- if $inlineCaptchaKeys }}
  captcha-site-key: {{ $bn.captcha.keys.siteKey | quote }}
  captcha-secret-key: {{ $bn.captcha.keys.secretKey | quote }}
  {{- end }}
{{- if and $bn.registerJob.enabled (ne $bn.crowdsec.namespace .Release.Namespace) }}
---
# Copie dans le namespace CrowdSec, pour le job d'enregistrement : un
# secretKeyRef ne lit que dans le namespace du pod, et le job doit tourner
# LÀ-BAS (c'est là que vivent les creds DB `crowdsec-secrets` et l'accès
# réseau intra-namespace vers PgBouncer). Seules les clés d'API y sont
# copiées — jamais les clés captcha, qui ne concernent pas la LAPI.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $bn.crowdsec.namespace }}
  labels:
    {{- include "bouncer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    "argocd.argoproj.io/sync-options": Prune=false
type: Opaque
stringData:
  ban-api-key: "{{ $banKey }}"
  captcha-api-key: "{{ $captchaKey }}"
{{- end }}
{{- end }}
