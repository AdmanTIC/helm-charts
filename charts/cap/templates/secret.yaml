{{- if not .Values.cap.adminKey.existingSecret }}
{{/*
Le mot de passe de l'IHM de Cap (ADMIN_KEY). Deuxième serrure derrière
l'authentification de l'Ingress d'administration : il ne sert qu'à ouvrir la
session Cap qui crée ou révoque les clés de site.

⚠️ La valeur vient des values EN CLAIR. À réserver aux values chiffrées (SOPS,
   sealed-secrets, external-secrets). Sinon : cap.adminKey.existingSecret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cap.adminSecretName" . }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
type: Opaque
stringData:
  adminKey: {{ .Values.cap.adminKey.value | quote }}
{{- end }}
