name: Publish Charts

on:
  push:
    branches:
      - master
      # Branche de compatibilité K8s 1.23 de traefik-coraza (subchart 39.0.9) :
      # seul CE chart y est packagé et poussé — les autres charts y sont figés
      # à un état ancien et ne doivent pas écraser leurs versions publiées.
      - traefik-coraza/0.6.x
  # Relance manuelle, depuis l'onglet Actions ou `gh workflow run publish-charts.yml`.
  # Ajouté après la panne Actions du 2026-08-26 : l'événement de push avait été
  # jeté par GitHub, et sans ce déclencheur il n'y avait aucun moyen de relancer
  # la publication autrement qu'en poussant un commit vide.
  workflow_dispatch:

jobs:

  publish:

    runs-on: ubuntu-latest
    container: dtzar/helm-kubectl:3.18.1
    steps:
    - uses: actions/checkout@v2

    - name: Authenticate to GHCR
      run: |
        echo "${{ secrets.GHCR_TOKEN }}" | helm registry login ghcr.io/admantic/helm-charts --username bmalynovytch --password-stdin

    - name: Package Charts
      run: |
        set -ex
        rm -rf packaged-charts
        mkdir packaged-charts
        # Sur la branche de compatibilité, un seul chart ; sur master, tous.
        if [ "${GITHUB_REF_NAME}" = "traefik-coraza/0.6.x" ]; then
          CHARTS="charts/traefik-coraza/"
        else
          CHARTS="charts/*/"
        fi
        for CHART in $CHARTS ;
        do
          helm package -d packaged-charts $CHART ;
        done;

    - name: Push to Chartmuseum
      run: |
        set -ex
        for CHART in packaged-charts/* ; do helm push $CHART oci://ghcr.io/admantic/helm-charts ; done